name: In-game bug or crash
description: Report a crash, wrong reward or problem while playing a Clawshot seed.
title: "[Game] "
body:
  - type: markdown
    attributes:
      value: |
        For problems with the UI, Generate or checking your game files, use **Clawshot itself** instead.
        Public test builds are unfinished. Read [the contribution rules](https://github.com/hiKareeem/Clawshot/blob/main/CONTRIBUTING.md).
        Attach only the whole `hookshot_log.txt` file, not screenshots or other files.
        The log contains your folder paths, including your Windows user name, but no game data. Those paths will be public with your report.
        Never attach game files, seed folders, saves, keys, caches or spoiler files.
  - type: input
    id: version
    attributes:
      label: Clawshot version
      description: "Give the zip folder's name (for example Clawshot-0.1.1). The settings string also starts with Clawshot-<version>:. For a source checkout, include the commit."
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed number
      description: Shown on Generate after Seed ready, or when you view the seed from My seeds.
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Whole settings string
      description: "Copy the whole Settings string from the finished seed on Generate, including its Clawshot-<version>: start. Do not shorten it. For a seed pack, paste its settings from pack.json."
      render: text
    validations:
      required: true
  - type: input
    id: hash
    attributes:
      label: Seed hash
      description: Copy Hash from the finished seed on Generate, or the hash beside it in My seeds. For a seed pack, use the hash printed by Make seed.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Hookshot version (or emulator name and version)
      description: Copy the first line of hookshot_log.txt for Hookshot. If using an emulator instead, give its name and version.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: For example Windows 11, or your Linux/macOS version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Where were you, and what was Link doing?
      description: Give the area, child or adult Link, what you were doing and the steps leading to the problem. Include relevant items and story progress. Mark item-location spoilers. Do not risk your saves to try again.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include any error text and whether Save and Continue or revisiting changed it, if already tried.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Attach the whole hookshot_log.txt file here
      description: "Drag the file here, rather than pasting an excerpt. Play writes it in your chosen output folder, beside user and seed (usually Documents/Clawshot/seed-<number>/hookshot_log.txt). Open seed folder opens the inner seed folder: go up one folder to find the log. For a seed pack, it is beside Play seed.bat. Emulator players: attach only the emulator's own log instead. If there is no log, explain why."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safe to publish
      options:
        - label: I understand that the log contains my folder paths and user name, which will be public.
          required: true
        - label: I attached only the log, and nothing else — no game files, seed folders, saves, keys, caches, spoilers or private credentials.
          required: true
