# Claude, r14 Track E, 2026-11-13: public native seeds refuse unpaired
# access overrides. Unchanged world defaults are always allowed.
# These values have paired game transforms or change generation guarantees only.
[logic_overrides]
free_time_travel = [false, true]
age_return_guarantee = [false, true]
keysanity = [false, true]
open_forest = ["closed", "closed_deku", "open"]
skip_mido = [false, true]
door_of_time = ["closed", "song_only", "open"]
bombs_without_bracelet = [false, true]

# Effective recipes contain these fields, but prepare() regenerates them from
# the selected door mode. Stored values are not user-controlled access overrides.
[logic_override_modes]
age_return_fill_inventory = "age_return_door_inventory"
age_return_fill_families = "age_return_door_families"

# Initial strength bypasses the native Darunia acquisition, not its song lesson.
# The inherited closed-door return bound in world/world.toml must not assume Saria
# merely because the child can lift Dodongo's Cavern's entrance rock.
[starting_return_bypasses]
"Goron Bracelet" = ["Sarias Song"]
