# Generator defaults. Logic defaults remain in data/world/{settings,world}.toml;
# a settings string stores overrides against this version's defaults.
[defaults]
shuffle = ["Chest"]
dungeon_items = "own_dungeon"
fast_start = ["intro"]
songs = "song"
shop_prices = "vanilla"
cheap_deku_shield = true # provisional, Round 6: 36 guaranteed forest rupees, near-total cost in seed 22
forest = "closed" # D24, Kareem: defaults close to vanilla; closed_deku/open are opt-in advanced choices

# Physical transforms are the same audited initial-value patcher as other fast start.
[forest.closed]
fast_start = []

[forest.closed_deku]
fast_start = ["forest_exit"]

[forest.open]
fast_start = ["mido", "forest_exit"]

[prices]
affordable = 10
shield_shop = "KF Shop"
shield_actor = "Shop_Weapon_Shield_Deku"
source = "Round 6 Track B, Kareem's early-forest rupee count; GoodsList PriceOffset verified by round 5 shop test"

# Actors actually acquired and used from a chest, not inferred from a successful gift swap.
[chest_verified.Item_Ocarina_Fairy]
source = "Kareem, 2026-11-08, chest-ocarina-storms: Fairy Ocarina acquired from Mido chest and used; plans/03-game-data.md section 19"

[chest_verified.Item_Melody_StormSong]
source = "Kareem, 2026-11-08, chest-ocarina-storms: Song of Storms learned from chest and played with chest Fairy Ocarina; plans/03-game-data.md section 19"

[songs_anywhere]
source = "Claude, Round 6 review, 2026-11-08: all twelve Item_Melody_* share the pouch/IsGet grant path. Storms played from a chest; the other eleven are inferred, not individually verified. Opt-in only; Minuet warp chest test pending."
