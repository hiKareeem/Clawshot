# Generator defaults. Logic defaults remain in data/world/{settings,world}.toml;
# a settings string stores overrides against this version's defaults.
[defaults]
shuffle = ["Chest"]
dungeon_items = "own_dungeon"
fast_start = ["intro"]
songs = "song"
shop_prices = "vanilla"
shop_slots = 8 # Round 8: first N native shelf indices per ordinary shop; 0 keeps all contents vanilla
scrub_prices = "vanilla" # supported shuffled once-sales only; repeat vendors remain vanilla
scrub_price = 10 # rupees when scrub_prices = fixed; 0..1000 (largest native wallet)
cheap_deku_shield = true # provisional, Round 6: 36 guaranteed forest rupees, near-total cost in seed 22
forest = "closed" # D24, Kareem: defaults close to vanilla; closed_deku/open are opt-in advanced choices
hints = "always" # D26, Kareem: stones speak without the Mask of Truth (OoT Randomizer's default); "mask" as vanilla
hint_distribution = "balanced" # Round 7: data/hints.toml; OoT Randomizer's default distribution

# Physical transforms are the same audited initial-value patcher as other fast start.
[forest.closed]
fast_start = []

[forest.closed_deku]
fast_start = ["forest_exit"]

[forest.open]
fast_start = ["mido", "forest_exit"]

[prices]
affordable = 10
shield_shop = "KF Shop"
shield_actor = "Shop_Weapon_Shield_Deku"
source = "Round 6 Track B, Kareem's early-forest rupee count; GoodsList PriceOffset verified by round 5 shop test"

