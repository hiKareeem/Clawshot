# Generator defaults. Logic defaults remain in data/world/{settings,world}.toml;
# a settings string stores overrides against this version's defaults.
#
# Played on Longshot rc.7, 2026-11-19 (Kareem via Claude): returning to child no longer
# gives an unowned Kokiri Sword; the adult Mirror Shield scrub purchase finishes;
# the 40-token gift gives its shuffled reward; dungeon map/compass display works.
# The Well replacement can be left, recovered and collected once across return/Continue.
# One Fortress rescue and its once-only 20-rupee drop passed on rc.7; on Longshot 3.0.0 (2026-11-21) four chest keys,
# all four rescues, the card once and Training Ground entry also passed (plans/rounds/r20-cows.md).
# Fortress keys stay experimental; Shadow's floor key stays vanilla.
# First-pull reward shuffle, medallion bridge below/at its count and the owned-three-Stones
# Door passed. On Longshot 3.0.0 stable (2026-11-19/20), refusal with only Emerald and Ruby
# and the Field/summit/Lake owl checks passed; owl skips remain experimental.
# Story-dialogue skipping is withdrawn for 0.2.3.
# Fairy after Time keeps Time selected. Adult Sun's Song also worked with Fairy in the
# control; no broader adult-song permission or lesson-safety change follows from that check.
# These are evidence notes only: defaults, pools and logic permissions are unchanged.
[defaults]
shuffle = ["Chest"]
dungeon_items = "own_dungeon"
shuffle_hideout_keys = false # Round 18, Kareem: the four Fortress jail keys get their own opt-in; needs Chest shuffle
shuffle_100_token_reward = false # Round 19, issue #12: opt-in progression at the first 100-token House reward; needs Gift shuffle
dungeon_rewards = false # Kareem, r18: shuffle only the nine reward slots, including Rauru
shuffle_master_sword = false # Round 19, Kareem: opt-in; cs19c proposal: Master Sword chest-only, needs Chest and free_time_travel
excluded_locations = [] # Round 20: player-selected locations never hold progression; empty preserves existing seeds
bridge = "vanilla"
bridge_count = 0 # stones 0..3, medallions 0..6, rewards 0..9, tokens 0..100; vanilla uses 0
trials_count = 6 # Round20: native default; 0..6 remaining trials, selected from a dedicated seeded stream
fast_start = ["intro"]
skippable_story = false # reserved for old off-valued settings; enabling it is refused
skip_saria_farewell = false # Round 19, Kareem: bridge timeline and animated grant become a plain item get
event_item_models = true # event-items D7 (BBender, 2026-11-25): events show the given item's model; Kareem to confirm (Q1)
songs = "song"
shop_prices = "vanilla"
shop_slots = 8 # Round 8: first N native shelf indices per ordinary shop; 0 keeps all contents vanilla
scrub_prices = "vanilla" # supported shuffled once-sales only; repeat vendors remain vanilla
scrub_price = 10 # rupees when scrub_prices = fixed; 0..1000 (largest native wallet)
cheap_deku_shield = true # provisional, Round 6: 36 guaranteed forest rupees, near-total cost in seed 22
forest = "closed" # D24, Kareem: defaults close to vanilla; closed_deku/open are opt-in advanced choices
door_of_time = "closed" # D35; both early modes wait for Zelda/Impa's send-off (round16); free travel is separate
hints = "always" # D26, Kareem: stones speak without the Mask of Truth (OoT Randomizer's default); "mask" as vanilla
hint_distribution = "balanced" # Round 7: data/hints.toml; OoT Randomizer's default distribution
starting_items = [] # Round 20: concrete audited starts, empty keeps existing new-game behavior
starting_hearts = 0 # extra hearts above three, 0..17
starting_full_wallet = false # selected native wallet's capacity, New Game only

# Physical transforms are the same audited initial-value patcher as other fast start.
[forest.closed]
fast_start = []

[forest.closed_deku]
fast_start = ["forest_exit"]

[forest.open]
fast_start = ["mido", "forest_exit"]

[prices]
affordable = 10
shield_shop = "KF Shop"
shield_actor = "Shop_Weapon_Shield_Deku"
source = "Round 6 Track B, Kareem's early-forest rupee count; GoodsList PriceOffset verified by round 5 shop test"

