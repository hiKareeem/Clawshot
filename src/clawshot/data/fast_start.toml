# Fast start: what a new game skips, one setting per table (plans/03-game-data.md, section 14).
#
# A setting changes the game's own data, never its code:
#   game_data  initial values in GameData/GameDataList.Product.110.byml.zs, by flag name. A new game resets every
#              flag to these values (Sequence/NormalTitle: SeqExecuteResetGameData before Sequence/Opening), so a
#              cutscene whose trigger tests a flag does not start, and the state it would have left is there from
#              the start. Values: true/false for a Bool, the step name for an Enum (a challenge's Step_<name>).
#   flow_edits registered event-flow transforms, applied alongside initial values. These preserve native loading,
#              initialization and equipment-gate actions rather than merely making a movie skippable.
#
# Each setting says what it skips, the state the game must still reach (`state`), where the facts come from
# (`source`), and, where it changes what a seed's logic may assume, `logic`. Facts are from build e0f3ccfa.
# `default = true` settings are on unless a run names its own list.

[setting.intro]
default = true
skips = "The opening movie (Dm_Kokiri_0000: the narrated prologue, the Great Deku Tree's dream and Navi's flight) does not play. Navi waking Link still plays."
state = "OpeningEvent:Opening_LoadingKokiriForest starts at the native load check, yields a frame while loading, and retains the native fade-in. New-game pouch/status setup and the reserved Opening_Introduction event are unchanged; no location visit flag is pre-set."
source = "Sequence/NormalTitle resets the new game then runs Sequence/Opening; pouch/status setup precedes Opening_LoadingKokiriForest. OpeningEvent Event3 transitions to the movie; bypassing it retains the load/fade continuation. Round13 audits the movie's effects and readers; Saria's Dm_Kokiri_0045 Event7, not the movie, supplies the forest visit banner (rounds/r13-fast-start.md)."
flow_edits = ["opening_without_movie"]

[setting.saria]
default = false
skips = "Saria waking Link at his door and walking him out (Dm_Kokiri_0045, Dm_Kokiri_0050) and her greeting Navi (Dm_Kokiri_0060)."
state = "Link's house door open (KokiriForest_LinkHouseDoor_Open: Dm_Kokiri_0045 sets it; the house prefab logic swaps the closed event door for an open one when it or HavePlayedEvent.Dm_Kokiri_0050 is set), Saria counted as talked to, and IsVisitLocation.KokiriForest true in place of Dm_Kokiri_0045 Event7's area banner so the pause map remains available. The basic-controls tutorial balloon (KokiriForest_Tutorial_BasicGuide) still shows: its logic waits for HavePlayedEvent.Dm_Kokiri_0030 and _0050."
source = "Logic KokiriForest_Child_Level_Npc_Kokiri_Saria_Child_a766 (request when Dm_Kokiri_0060 not played, area hit; areas removed once Dm_Kokiri_0045 or _0060 played), Land_Kokiri_House_A_Prefab_5d58 (door), flow Dm_Kokiri_0045 (door flag, HaveTalked Saria, Dm_Kokiri_0050_After_Near_End, then EventTransition Dm_Kokiri_0050; Event7 opens KokiriForest's location UI). Round13: Hookshot Randomized section5 lead, independently verified from flow, RSDB Location IsShowLocationUIFirstTimeInDemo and saved visit flag (rounds/r13-fast-start.md)."

[setting.saria.game_data]
"HavePlayedEvent.Dm_Kokiri_0045" = true
"HavePlayedEvent.Dm_Kokiri_0050" = true
"HavePlayedEvent.Dm_Kokiri_0060" = true
"KokiriForest_LinkHouseDoor_Open" = true
"HaveTalked.Npc_Kokiri_Saria_Child" = true
"IsVisitLocation.KokiriForest" = true

[setting.mido]
default = false
skips = "Mido blocking the path to the Great Deku Tree until Link has the Kokiri Sword and a shield; he stands aside from the start. Either Deku or Hylian Shield works (Kareem, 2026-11-08)."
state = "KokiriForest_Npc_Kokiri_Mido_Child_Blocker false (his BlockerParam blocks while it is true; Npc_Kokiri_Mido_Child sets it false when shown the sword and shield). His challenge steps Meet_DekuTree Step02/Step03 are skipped; the Deku Tree's talk still triggers (its area stays until Meet_DekuTree is past Step03) and sets Complete."
source = "GameParameter/BlockerParam/Npc_Blocker_Mido in Pack/Actor/Npc_Kokiri_Mido_Child names the flag; flow Npc_Kokiri_Mido_Child Event26/Event29 clear it; GameDataList default true; r3-seed/user-seed-3 slot_05 has it false after the shield was shown."
logic = "In generator settings, legacy --skip mido aliases forest=open; that mode pairs this Mido flag with forest_exit. The standalone flag patch remains Mido-only."

[setting.mido.game_data]
"KokiriForest_Npc_Kokiri_Mido_Child_Blocker" = false

[setting.forest_exit]
default = false
skips = "The child Kokiri blocking the bridge out of Kokiri Forest; Mido and the Deku Tree remain vanilla."
state = "KokiriForest_Npc_Kokiri_007_Child_Blocker_00 false disables the bridge NPC's blocker AI and its sensor area. The transient KokiriForest_Npc_Kokiri_007_Child_Blocker already defaults false and is not changed. No Gohma/story quest is completed."
source = "Build e0f3ccfa: Npc_Kokiri_007_Child.pack BlockerParam Npc_Blocker_Kokiri_007 GameDataToEnableAI names the _00 flag; KokiriForest_Child_Level_All_02_d26e nodes 5/0/6 delete Area_a467 when it is false, so nodes 1/4 cannot reassert the transient blocker. Npc_Kokiri_007_Child Event42 only clears _00; no flow sets it true. GameDataList default true, reset 8, save file 0."
logic = "forest=closed_deku and open map to open_forest != closed, so can_leave_forest is true from the start; only open bypasses Mido."

[setting.forest_exit.game_data]
"KokiriForest_Npc_Kokiri_007_Child_Blocker_00" = false

[setting.deku_tree]
default = false
skips = "The Great Deku Tree's arrival talk (Dm_Kokiri_0070 and Dm_Kokiri_0075). With Mido kept, its state is applied after his native sword/shield clear; with Mido skipped, his mouth is open from the start."
state = "The four values below are applied only after kept Mido's native clear: seen 0070 (face fog), Meet_DekuTree Complete, Get_StoneOfForest GoInside, mouth open. His early quest state, idle schedule, Talk initialization, equipment checks and blocker clear remain native. With Mido bypassed, these are initial values instead and his flow is unchanged."
source = "Native Mido Event26 clears the saved blocker, Event32 ends blocker AI, Event33/48 retain talk flags, Event0 advances Step03. Round13 changes only this clear tail to supply the skipped tree-talk state. The failed late-entry wrapper omitted per-entry sub_flow_events registration for Event222, reached before equipment checks or messages; it was removed (rounds/r13-fast-start.md)."
flow_edits = ["deku_tree_after_mido"]

[setting.deku_tree.game_data]
"HavePlayedEvent.Dm_Kokiri_0070" = true
"KokiriForest_Meet_DekuTree_OpenDekuTreeMouth" = true
"Step_Meet_DekuTree" = "Complete"
"Step_Get_StoneOfForest" = "GoInside"

[setting.kaepora]
default = false
skips = "Kaepora Gaebora's first talk when Link enters Hyrule Field (event HyruleField_Goto_HyruleCastle_Kaepora: Dm_HrlField_0000, _0005, _0010) and his talk in the Lost Woods after Saria's Song (Dm_LostWood_0010)."
state = "Challenge Goto_HyruleCastle at Step02, as the Hyrule Field talk leaves it (Goto_HyruleCastle Event14): the Market entry event (Market_Child_Prefab_c061) only fires at exactly Step02 and the later steps chain from it up to Zelda's courtyard (HyruleCastle_Prefab_941f fires at exactly Step04). UI_IsFinishChallengeMenuOpenEvent true (the talk sets it; the Main, PlusMenu and ChallengeLog sequences read it). HavePlayedEvent.Dm_HrlField_0000 true ends the native BGM-suppression intervals before the field panorama, so skipping the owl does not leave field music disabled. Not restored: the talk also adds Pouch_Amiibo (Event205). Side effect of Step02 from the start: the Kokiri in front of the shop no longer stops Link (KokiriForest_Kokiri_011_StopInFrontOfShop_00 is removed once Goto_HyruleCastle reaches Step01)."
source = "Logic HyruleField_Child_Prefab_de5f (request when Dm_HrlField_0010 not played, area hit; area removed once Goto_HyruleCastle is past Step01); flow Goto_HyruleCastle entry Goto_HyruleCastle_Kaepora_00; Dm_SY_BancChangeArrive Event213 plays Dm_LostWood_0010 unless played. Section46: Bootup pack BGMGeneralParam_Default SequenceRangeDisableBgm ends the post-Saria and post-Gohma pre-panorama intervals at GameData hash3546103570 (HavePlayedEvent.Dm_HrlField_0000); marking only _0010 does not release them. The existing GameData writer suffices; no audio resource or native quest gate is patched."

[setting.kaepora.game_data]
"HavePlayedEvent.Dm_HrlField_0000" = true
"HavePlayedEvent.Dm_HrlField_0010" = true
"HavePlayedEvent.Dm_LostWood_0010" = true
"UI_IsFinishChallengeMenuOpenEvent" = true
"Step_Goto_HyruleCastle" = "Step02"

# --- Applied to every seed, not a choice ([always.*], gamedata.load_always) -------------------------------------------

[always.dpad]
default = true
skips = "Nothing is skipped: the D-pad (where the ocarina, the Navi button and item shortcuts sit) is there from the start of a new game, as an item that needs it (an ocarina, a shortcut item) can be found before the Great Deku Tree."
state = "ActionGuide_IsEnd.Navi true (saved Bool, default false). The game sets it on entering the Deku Tree (Navi's guide); until then the HUD has no D-pad, so an ocarina found earlier cannot be played."
source = "sloperina docs/FINDINGS.md section 1 (the D-pad only exists once ActionGuide_IsEnd.Navi is set) and section 5.1/5.4 (unticking an ocarina leaves it set, the D-pad stays); GameDataList Bool 0x7BE57CB0 (murmur3 of the name), SaveFileIndex 0; reported by mysterypaint 2026-11-12 (D-pad missing in an Archipelago seed)."

[always.dpad.game_data]
"ActionGuide_IsEnd.Navi" = true
