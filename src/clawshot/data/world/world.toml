# The world the generator loads: its start region, its goal, and the region files that make it, plus Clawshot's
# own settings and items (the generated files hold OoT Randomizer's). Format: plans/04-world-format.md.
# Region files are written by `python -m clawshot.world.translate` (port.toml); the remake's differences from
# them are in `overrides` (written by hand, each with its source).

# OoT Randomizer's start region: both ages are reached here; its exit "Root Exits" admits the starting age, and
# the other age once "Time Travel" is held.
start = "Root"

# OoT Randomizer's goal: the Triforce, the event of beating Ganon (Bosses.json, "Ganondorf Boss Room").
goal = "Triforce"

files = [
    "root.toml",
    "kokiri_forest.toml",
    "lost_woods.toml",
    "sacred_forest_meadow.toml",
    "hyrule_field.toml",
    "lon_lon_ranch.toml",
    "lake_hylia.toml",
    "gerudo_valley.toml",
    "gerudo_fortress.toml",
    "haunted_wasteland.toml",
    "desert_colossus.toml",
    "market.toml",
    "temple_of_time.toml",
    "hyrule_castle.toml",
    "outside_ganons_castle.toml",
    "kakariko.toml",
    "graveyard.toml",
    "death_mountain_trail.toml",
    "goron_city.toml",
    "death_mountain_crater.toml",
    "zora_river.toml",
    "zoras_domain.toml",
    "zoras_fountain.toml",
    "deku_tree.toml",
    "dodongos_cavern.toml",
    "jabu_jabus_belly.toml",
    "forest_temple.toml",
    "fire_temple.toml",
    "water_temple.toml",
    "shadow_temple.toml",
    "spirit_temple.toml",
    "bottom_of_the_well.toml",
    "ice_cavern.toml",
    "gerudo_training_ground.toml",
    "ganons_castle.toml",
]

# The remake's differences from the translated files, and Clawshot's own per-location facts.
overrides = "remake.toml"

[settings]
# Read only by a world built directly (build_world, the oracle tests): false, each check gives the tier it gives in
# the remake (`vanilla_fixed`, decision D16); true, OoT Randomizer's progressive vanilla items. Seeds never read it:
# their world pins it to false and uses the native chains below (clawshot.generate.progressive.prepare_spec).
progressive_items = false
# Mido's child blocker only; the separate forest-exit gate is unchanged.
skip_mido = false
# D35: paired with patch.door, separate from free_time_travel.
door_of_time = "closed"

# Adult return pedestal: Market_Adult_Prefab_89da deletes its attention actor until the Forest quest is complete.
# Dm_SY_BancChange_EscapeDungeon Event199 completes that quest after the Forest blue warp, not medal possession.
# Exact source: plans/03-game-data.md section 16; the search keeps a separate pre-pull child inventory until then.
age_return_event = "Defeat Phantom Ganon"
age_return_region = "Beyond Door of Time"

# Provisional default, reviewer 2026-11-08: returning must not rely on optional child errands before the pull.
# The search derives mandatory counts from each seed's child-only pull routes, including prerequisite items.
age_return_guarantee = true
age_pull_event = "Time Travel"

# Default off: round9 return/Prelude passed, round10's complete first-arrival fix awaits play.
# Keeps Temple Sheik through both first-arrival scenes, then hides him until Forest completion.
free_time_travel = false

# Return-kit fill constraint (reviewer, round 5): Forest's checked rules need Bow, strength, grapple and keys.
# Keep strength copies adult-only. Claude's Round 14 exception credits native Darunia's Bracelet as child
# capability, not a copy tier: child DC still requires his Lullaby/Saria route, while adult strength needs copies.
age_return_fill_families = ["Bow", "Progressive Hookshot", "Progressive Strength Upgrade", "Small Key (Forest Temple)", "Boss Key (Forest Temple)"]
age_return_bypass_families = ["Progressive Strength Upgrade"]
# Safe lower bound: closed Door requires Ocarina 2 + Time + the completed courtyard/Impa story.
# Native child Bracelet requires Saria but adds no adult copy tier; the kit places the first adult copy itself.
age_return_fill_inventory = { "Ocarina" = 2, "Song of Time" = 1, "Sarias Song" = 1, "Goron Bracelet" = 1, "Met Child Zelda" = 1 }
# Earlier doors cannot assume optional child strength/Saria/Time-ocarina pickups in that kit.
# The proof remains independent; unshuffled child-only prerequisites can make early return impossible.
age_return_door_inventory = { song_only = { "Ocarina" = 1, "Song of Time" = 1 }, open = {} }
age_return_door_families = { song_only = ["Bow", "Progressive Hookshot", "Progressive Strength Upgrade", "Small Key (Forest Temple)", "Boss Key (Forest Temple)", "Sarias Song", "Ocarina"], open = ["Bow", "Progressive Hookshot", "Progressive Strength Upgrade", "Small Key (Forest Temple)", "Boss Key (Forest Temple)", "Sarias Song", "Ocarina"] }

# Native-slot tier policy (r13, Kareem/Claude 2026-11-12): conservatively retain the adult Silver -> Golden
# gauntlet and Silver -> Golden scale order. Actual downgrade behavior of those pairs is not game-proven.
# Kareem played: switching ages preserves the child's Goron Bracelet alongside adult Silver/Golden Gauntlets.
# The Bracelet is a separate child item, not a lower tier that can downgrade the adult gauntlets.
# Fixed strength tiers still MAX-combine in a world built directly; this exemption affects placement order only. A
# seed's world counts only progressive copies, so it has no native-chain tier to order ([native_progressive]).
downgrade_tier_families = ["Progressive Strength Upgrade", "Progressive Scale"]
downgrade_tier_exemptions = ["Goron Bracelet"]

# Each progressive item's tiers, lowest first. Tier n is an item of its own that raises the progressive item to at
# least n (`Item.tier`: the highest fixed tier held, never a sum), so OoT Randomizer's rules ("Hookshot" =
# Progressive_Hookshot, "Longshot" = (Progressive_Hookshot, 2)) read fixed and progressive items alike in a world built
# directly; a seed's world counts only copies ([native_progressive]). The wallets stop at the remake's Giant Wallet
# (1000 rupees, plans/03-game-data.md section 47; no rule asks for a third). The magic tiers are the remake's two
# native meter grants (MP 24, MPDouble 48, section 47).
[progressive]
"Progressive Hookshot" = ["Hookshot", "Longshot"]
"Progressive Strength Upgrade" = ["Goron Bracelet", "Silver Gauntlets", "Golden Gauntlets"]
"Progressive Scale" = ["Silver Scale", "Golden Scale"]
"Progressive Wallet" = ["Adult Wallet", "Giant Wallet"]
"Ocarina" = ["Fairy Ocarina", "Ocarina of Time"]
"Magic Meter" = ["Magic Meter (Single)", "Magic Meter (Double)"]

# Round 14 (issue #13; Kareem, 2026-11-13; plans/03-game-data.md section 47): the remake's eight native upgrade
# chains are progressive in every seed, always, with no setting (clawshot.progressive.CHAINS has their tiers). A
# shuffled check's own upgrade enters the pool as its chain's raw copy, and ordinary chest filler makes up the rest:
# N copies for N tiers (clawshot.generate.progressive). A seed's world counts only the copies, the Nth copy tier N
# (`copies_only`, set by prepare_spec, never here): an unshuffled check keeps its fixed tier as a bonus in any order.
# Copies go only to `destinations`: a chest event reads the owned tiers before the get window, gifts, shops, scrubs
# and floor pick-ups cannot. `first`: a copy grants a missing first tier before the next one, the child Goron
# Bracelet before adult gauntlets (Kareem played 2026-11-12: adult gauntlets do not supersede it), a weapon before
# its capacity.
[native_progressive]
chains = [
    "Progressive Hookshot",
    "Progressive Strength",
    "Progressive Scale",
    "Progressive Wallet",
    "Progressive Bomb Bag",
    "Progressive Quiver",
    "Progressive Slingshot",
    "Progressive Magic",
]
first = ["Progressive Strength", "Progressive Quiver", "Progressive Slingshot"]
destinations = ["Chest"]

[items]
# The Lost Woods target game's prize is a bigger bullet bag: OoT Randomizer gives a progressive Slingshot there.
"Bullet Bag (40)" = { class = "normal" }
# Native minigame upgrades (cs10a, section40): bags are not rental weapon ownership.
"Bomb Bag (30)" = { class = "progression", alias = ["Bomb Bag", 1] }
"Quiver (40)" = { class = "normal" }
"Scrub Business Seed" = { class = "normal" } # D12: remake-only filler
"Magic Jar" = { class = "normal" } # census Tbox_MagicJar_Large; no ability added
# The remake's large native capacities (section 47): only a progressive copy or a native ownership-dependent prize
# gives them. A bomb bag is usable bombs; a quiver or bullet bag alone is not the weapon.
"Bomb Bag (40)" = { class = "progression", alias = ["Bomb Bag", 1] }
"Quiver (50)" = { class = "normal" }
"Bullet Bag (50)" = { class = "normal" }
# Raw progressive copies (section 47; [native_progressive]). Progressive Hookshot, Scale and Wallet are OoT
# Randomizer's own items. Strength's first copy physically grants a missing child Bracelet, but seed logic
# deliberately takes child strength only from Darunia's native gift; adult tiers remain copy-only (section 47).
# The first quiver/slingshot copy is the weapon, the first bomb bag copy a bag, the first magic copy a meter.
"Progressive Strength" = { class = "progression", alias = ["Progressive Strength Upgrade", 1] }
"Progressive Bomb Bag" = { class = "progression", alias = ["Bomb Bag", 1] }
"Progressive Quiver" = { class = "progression", alias = ["Bow", 1] }
"Progressive Slingshot" = { class = "progression", alias = ["Slingshot", 1] }
"Progressive Magic" = { class = "progression", alias = ["Magic Meter", 1] }

[helpers.Progressive_Strength_Upgrade]
# The quoted counted form reads the raw counter, not this age-aware helper.
rule = "(progressive_copies_only and is_child and 'Goron Bracelet') or ((not progressive_copies_only or not is_child) and ('Progressive Strength Upgrade', 1))"
source = "Claude, 2026-11-13, Round 14 deliberate child-capability exception: native Darunia's Lullaby/Saria/door route supplies child lift but no copy tier; all three copies supply adult tiers. E native audit work/r14-steps/ainb/FINDINGS.md:70-73 confirms DC has no quest-step precondition. See plans/rounds/r14-progressive.md."
