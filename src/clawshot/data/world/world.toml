# The world the generator loads: its start region, its goal, and the region files that make it, plus Clawshot's
# own settings and items (the generated files hold OoT Randomizer's). Format: plans/04-world-format.md.
# Region files are written by `python -m clawshot.world.translate` (port.toml); the remake's differences from
# them are in `overrides` (written by hand, each with its source).

# OoT Randomizer's start region: both ages are reached here; its exit "Root Exits" admits the starting age, and
# the other age once "Time Travel" is held.
start = "Root"

# OoT Randomizer's goal: the Triforce, the event of beating Ganon (Bosses.json, "Ganondorf Boss Room").
goal = "Triforce"

files = [
    "root.toml",
    "kokiri_forest.toml",
    "lost_woods.toml",
    "sacred_forest_meadow.toml",
    "hyrule_field.toml",
    "lon_lon_ranch.toml",
    "lake_hylia.toml",
    "gerudo_valley.toml",
    "gerudo_fortress.toml",
    "haunted_wasteland.toml",
    "desert_colossus.toml",
    "market.toml",
    "temple_of_time.toml",
    "hyrule_castle.toml",
    "outside_ganons_castle.toml",
    "kakariko.toml",
    "graveyard.toml",
    "death_mountain_trail.toml",
    "goron_city.toml",
    "death_mountain_crater.toml",
    "zora_river.toml",
    "zoras_domain.toml",
    "zoras_fountain.toml",
    "deku_tree.toml",
    "dodongos_cavern.toml",
    "jabu_jabus_belly.toml",
    "forest_temple.toml",
    "fire_temple.toml",
    "water_temple.toml",
    "shadow_temple.toml",
    "spirit_temple.toml",
    "bottom_of_the_well.toml",
    "ice_cavern.toml",
    "gerudo_training_ground.toml",
    "ganons_castle.toml",
]

# The remake's differences from the translated files, and Clawshot's own per-location facts.
overrides = "remake.toml"

[settings]
# false: each check gives one fixed item, as the remake does without code hooks (a chest holding the Longshot
# gives the Longshot, found first or not); vanilla items are the tier a check gives (`vanilla_fixed`).
# true: OoT Randomizer's progressive items (needs event-flow edits or a Hookshot hook). Default false: decision D16
# (Kareem, round 2).
progressive_items = false

# Adult return pedestal: Market_Adult_Prefab_89da deletes its attention actor until the Forest quest is complete.
# Dm_SY_BancChange_EscapeDungeon Event199 completes that quest after the Forest blue warp, not medal possession.
# Exact source: plans/03-game-data.md section 16; the search keeps a separate pre-pull child inventory until then.
age_return_event = "Defeat Phantom Ganon"
age_return_region = "Beyond Door of Time"

# Each progressive item's tiers, lowest first. Tier n is an item of its own that counts as n of the progressive
# item, so OoT Randomizer's rules ("Hookshot" = Progressive_Hookshot, "Longshot" = (Progressive_Hookshot, 2))
# read fixed and progressive items alike. Finding a higher tier first gives that tier's ability [inference: the
# remake granting a Longshot or Golden Gauntlets without the lower tier is not checked in game yet].
[progressive]
"Progressive Hookshot" = ["Hookshot", "Longshot"]
"Progressive Strength Upgrade" = ["Goron Bracelet", "Silver Gauntlets", "Golden Gauntlets"]
"Progressive Scale" = ["Silver Scale", "Golden Scale"]
"Progressive Wallet" = ["Adult Wallet", "Giant Wallet", "Tycoon Wallet"]
"Ocarina" = ["Fairy Ocarina", "Ocarina of Time"]

[items]
# The Lost Woods target game's prize is a bigger bullet bag: OoT Randomizer gives a progressive Slingshot there.
"Bullet Bag (40)" = { class = "normal" }
