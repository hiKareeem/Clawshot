# Hyrule Field, child side, as the remake builds it (round 4, track A). Format: plans/04-world-format.md,
# "Overrides". What was checked and left as OoT Randomizer has it: E:/OOTRemake/work/r4-logic-child/findings/hyrule_field.md.
#
# Sources:
# - Eurogamer, "All new changes in the Ocarina of Time remake", 2026-11-05,
#   https://www.eurogamer.net/all-new-changes-zelda-ocarina-of-time-switch-2
# - IGN, "Biggest Changes and Differences", 2026-11-05,
#   https://www.ign.com/wikis/ocarina-of-time-remake/Biggest_Changes_and_Differences
# - Nintendo Life, "All Heart Piece locations" (Switch 2), 2026-11-06,
#   https://www.nintendolife.com/guides/zelda-ocarina-of-time-heart-piece-locations-switch-2
# - Nintendo Life, "Business Scrub password guide" (Switch 2), 2026-11-06,
#   https://www.nintendolife.com/guides/zelda-ocarina-of-time-business-scrub-password-switch-2
# - RPG Site, "Minimalist 100% walkthrough" (Switch 2 remake), 2026-11-05,
#   https://www.rpgsite.net/guide/21671-the-legend-zelda-ocarina-time-remake-minimalist-100-walkthrough-all-items-gold-skulltula-tokens-heart-pieces
# - Gold Skulltula guides (Eurogamer, Polygon; local copies in E:/OOTRemake/work/r3/, facts only).
# - Placement data (HyruleField_{Child,Adult}_{Static,Dynamic}, read by E:/OOTRemake/work/r4-logic-child/actors.py),
#   Banc coordinates in metres, y up, +x east, +z south. The HyruleField Banc also holds Lon Lon Ranch and Lake Hylia.
#
# The remake's Hyrule Field has eight grottos, every entrance under a visible cover with a
# FldObj_AirWall_HidingHoleCover: the scrub (40,148,27), the tektite pool (-98,147,17), the fairy fountain
# (-13,150,169), the ReDead grotto by Kakariko (163,156,27; Kak Redead Grotto, set by child_kakariko.toml), the cow
# (-258,141,138), the Gold Skulltula in the southern wood (-156,144,338), the wetlands (40,145,342) and the east one
# (180,157,190). The last two hold a Gossip Stone and no chest, fish, shrub or beehive.
#
# Confirmed unchanged: HF Ocarina of Time Item and Song from Ocarina of Time keep the translated
# "is_child and has_all_stones" rule, without can_dive/Progressive_Scale. Source: Kareem in game via Claude,
# 2026-11-08 (build e0f3ccfa): the castle moat is shallow and the Ocarina needs no Silver Scale (HF01).
# Child_Static places Obj_Ocarina_Time_A_01 Hash 2802436684568022035 at (16,145,43).
# The item's fixed tier is owned by remake.toml; no duplicate location override is needed here.

# Grottos: every grotto entrance is visible in the remake and the Stone of Agony (now the Echo Gem) finds Gold
# Skulltulas, not grottos (cross-area decision, Main, round 4). HyruleField's only two AgonyStoneReactArea actors
# are at Gold Skulltulas inside grottos.

[exits."Hyrule Field"."HF Inside Fence Grotto"]
rule = "can_blast_or_smash"
was = "can_open_bomb_grotto"
source = "Eurogamer, 'all new changes': every grotto entrance is visible, bomb or Song of Storms is obvious, the Stone of Agony is the Echo Gem (finds Gold Skulltulas); Nintendo Life scrub password guide: bomb the cracked spot just right of the castle gate by the river; data: Land_HrlField_HidingHoleCover_A_01 2319887810288392884 and FldObj_AirWall_HidingHoleCover 3592000181700157958 at (40,148,27), the heart piece scrub inside at (25,130,22)"

