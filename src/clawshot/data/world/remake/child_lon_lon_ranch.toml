# Lon Lon Ranch, child side, as the remake builds it (round 4, track A). Format: plans/04-world-format.md,
# "Overrides". What was checked and left as OoT Randomizer has it: E:/OOTRemake/work/r4-logic-child/findings/lon_lon_ranch.md.
#
# Sources:
# - Eurogamer, "All new changes in the Ocarina of Time remake", 2026-11-05,
#   https://www.eurogamer.net/all-new-changes-zelda-ocarina-of-time-switch-2
# - Gold Skulltula guides (Eurogamer, Polygon; local copies in E:/OOTRemake/work/r3/, facts only).
# - Placement data (HyruleField_{Child,Adult}_{Static,Dynamic}: the remake's Lon Lon Ranch is part of the
#   HyruleField Banc, read by E:/OOTRemake/work/r4-logic-child/actors.py), Banc coordinates in metres, y up.

# Time of day: the remake's clock starts only once Link has met Zelda (cross-area decision, Main, round 4; the
# event 'Time Flows' is set in child_hyrule_castle.toml).

[locations."LLR GS House Window"]
rule = "can_use(Boomerang) and ((at_night and 'Time Flows') or gold_skulls_ignore_daytime)"
was = "can_use(Boomerang) and (at_night or gold_skulls_ignore_daytime)"
source = "Eurogamer, 'all new changes': time does not flow until Link has met Princess Zelda; Eurogamer and Polygon Gold Skulltula guides: child, night only, Boomerang, on an upper window of the ranch house; data: Enemy_Skulltula_Gold 15889002414176907668 with Enemy_Skulltula_Gold_Nocturnal=True at (-63,156,212), Child_Static only"

# The reward can move; Get_Epona's progress stays at Malon's child song source.
# Reaching/clearing that source is independent of what shuffled item it gives.
[events."Lon Lon Ranch"."Malon Song Source Cleared"]
new = true
rule = "is_child and Ocarina and at_day and at('Hyrule Castle Grounds', is_child and (Weird_Egg or Chicken))"
source = "03-game-data.md section 48 (cs14e, build e0f3ccfa): the existing Song from Malon route reaches SubEvent_GetEponaSong -> Dm_MelodyGet_Epona; C07/Event82 is the sole AfterGetEponaSong write, after the source reward. A shuffled song elsewhere does not execute it. The source needs the child instrument/day/Talon-wake route (Overworld.json:2793); no Eponas Song ownership is required to clear it."

[events."Lon Lon Ranch".Epona]
rule = "can_play(Eponas_Song) and is_adult and at_day and 'Malon Song Source Cleared'"
was = "can_play(Eponas_Song) and is_adult and at_day"
source = "03-game-data.md section 48 (cs14e, build e0f3ccfa): Npc_Hylia_Ingo_002_Adult Event12/Event90 and Npc_Hylia_Malon_Adult Event178/Event86 require Get_Epona past ReadyForGetEponaSong. Only Malon's child source sets AfterGetEponaSong (Dm_MelodyGet_Epona C07/Event82). Retain the playable adult song and day requirements; completing the shuffled source does not itself grant Epona or its song."

[events."Lon Lon Ranch"."Links Cow"]
rule = "can_play(Eponas_Song) and is_adult and at_day and 'Malon Song Source Cleared'"
was = "can_play(Eponas_Song) and is_adult and at_day"
source = "03-game-data.md section 48 (cs14e, build e0f3ccfa): the native adult ranch/race chain first needs Get_Epona past ReadyForGetEponaSong, whose sole advancement is Malon's child song source. Keep the existing Epona/song/day route and additionally require that source; cows remain unshuffled."
