source = "Eurogamer Goron City page: the pot heart piece needs the Goron's Bracelet as child: light all the torches, then toss Bomb Flowers into the spinning jug (the Bomb Bag only makes aiming easier); Game8 Switch 2 list: throw a bomb from the bomb flowers by the Lost Woods entrance or from the Bomb Bag. Data: Obj_BombFlower_A_03 7966326031307316945 (15,106,1) and 4547230728780892731 (14,107,-4) on the ring above the pot Obj_GoronCity_LargePot_A_01 (0,100,0); bomb flowers respawn (Obj_BombFlower_A_01 ActorParam: AlwaysRespawn). So the bracelet way is normal play here, not OoT Randomizer's trick logic_goron_city_pot_with_strength. Torches unchanged: four Obj_CandleStick_TimeExtinguish_A_01 round the pot, lit with a Deku Stick (IGN)"
