source = "03-game-data.md section 22: no Obj_GossipStone_A_01 in the DMT storms grotto room"

# The four remake-only stones. Region and rule follow the check or room they share.

[locations."SFM Song of Time Clearing Gossip Stone"]
new = true
region = "Sacred Forest Meadow"
type = "HintStone"
rule = "is_adult and has_explosives and can_play(Song_of_Time)"
source = "GOSSIP_KOKIRI_FOREST_02 (SacredForestMeadow): behind the Song of Time blocks with the Business Scrub Seed chest (Zelda Central remake gossip stones guide, https://zeldacentral.com/games/ocarina-of-time-remake/gossip-stones/); the rule is that chest's (remake/extra_sacred_forest_meadow.toml, cs5c)"

[locations."Kak Bomb Grotto Gossip Stone"]
new = true
region = "Kakariko Village"
type = "HintStone"
rule = "can_blast_or_smash"
source = "GOSSIP_DEATH_MOUNTAIN_TRAIL_01 (KakarikoVillage): Kakariko's only bomb grotto (Land_HidingHole_Base_A_01 at (-20,97,66)) holds the stone and seven beehives, under cover 12611727494616924395 (r4-logic-child.md, Kakariko; remake/child_kakariko.toml). Bomb grottos open with can_blast_or_smash in the remake: every entrance is visible and the Stone of Agony finds Gold Skulltulas (remake/child_hyrule_field.toml, round 4)"

[locations."ZR Storms Grotto Gossip Stone"]
new = true
region = "ZR Storms Grotto"
type = "HintStone"
rule = "True"
source = "GOSSIP_LOST_WOOD_01 (ZoraRiver): in the storms grotto room under cover 5489068764052953067 with a butterfly fairy and four pots (r4-logic-child.md, Zora's River; census.hints.STONE_LINKS)"

[locations."DMT Cow Grotto Gossip Stone"]
new = true
region = "DMT Cow Grotto"
type = "HintStone"
rule = "True"
source = "GOSSIP_HYRULE_CASTLE_03 (DeathMountainTrail): in the grotto room with the cow, beside the storms grotto room (census.hints.STONE_LINKS)"
