# Gossip Stones (round 7, cs7a): the remake's differences from OoT Randomizer's `HintStone` locations, which the
# translator keeps as hint locations (`World.hint_stones`). The census of the 40 talking stones and the link of each to
# an OoT Randomizer stone is `clawshot.census.hints.STONE_LINKS` (plans/03-game-data.md section 22, round 6 cs6c).
# Every OoT Randomizer stone that has a remake stone keeps its translated region and rule; the four below have none,
# and the remake adds four stones OoT Randomizer does not have.

[locations."KF Storms Grotto Gossip Stone"]
n64_only = "the remake's storms grotto room holds the scrub trio and a chest, no stone (r4-logic-child.md; census.hints.OOTR_STONES_MISSING)"
source = "03-game-data.md section 22: no Obj_GossipStone_A_01 in the KF storms grotto room"

[locations."LW Near Shortcuts Grotto Gossip Stone"]
n64_only = "the room under the boulder holds no stone (r4-logic-child.md; census.hints.OOTR_STONES_MISSING)"
source = "03-game-data.md section 22: no Obj_GossipStone_A_01 in the LW near-shortcuts grotto room"

[locations."HF Near Market Grotto Gossip Stone"]
n64_only = "Hyrule Field has one generic grotto fewer; its east grotto stone (GOSSIP_HYRULE_FIELD_02) is linked to the Southeast grotto (census.hints.STONE_LINKS)"
source = "03-game-data.md section 22: 40 talking stones, three generic-grotto stones in HyruleField"

[locations."DMT Storms Grotto Gossip Stone"]
