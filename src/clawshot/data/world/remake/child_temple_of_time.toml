# Temple of Time (in the Market Banc folder), child side, as the remake builds it (round 4, track A). Format:
# plans/04-world-format.md, "Overrides". What was checked and left as OoT Randomizer has it:
# E:/OOTRemake/work/r4-logic-child/findings/temple_of_time.md.
#
# Sources:
# - Nintendo Life, walkthrough hub (Switch 2), "Temple of Time",
#   https://www.nintendolife.com/guides/zelda-ocarina-of-time-walkthrough-switch-2-remake
# - Event flow DoorOfTime (romfs EventFlow, decoded in E:/OOTRemake/work/r1-research/decoded/evfl_all.json) and the
#   placement data (Market_Child_Static, read by E:/OOTRemake/work/r4-logic-child/actors.py).

# The Door of Time is the vanilla one: the three Spiritual Stones, the Ocarina of Time and the Song of Time. OoT
# Randomizer's default (`open_door_of_time = 'sot'`) asks only for the Song of Time; the remake has no such option
# without a code hook, so the setting is not read here (its 'open' value would not open the door in the game).
# Shared rule: the same door for both ages.

[exits."Temple of Time"."Beyond Door of Time"]
rule = "has_all_stones and (Ocarina, 2) and can_play(Song_of_Time)"
was = "can_open_door_of_time"
source = "data: EventProxyRequestActor 11695057968283014044 (Market_Child_DoorOfTime_OpenDoor) links the stone altar Obj_TimeTemple_SpiritStoneBase_A_01 15955260055312345707, the three Obj_TimeTemple_SpiritStone_A_01/02/03 and Obj_TimeTemple_Door_A_01; flow DoorOfTime: CheckStoneNum counts the Fire and Water stone quests, the quest then moves on to the Ocarina of Time at the moat (DoorOfTime_GetOcarinaOfTime), and OpenDoor opens the door on the Song of Time (Dm_TimeTemple_0010); Nintendo Life walkthrough: with the Spiritual Stone of Water, collect the Ocarina of Time from the moat, learn the Song of Time and play it before the inscription. OoT Randomizer's 'stones_oot_sot' condition"
