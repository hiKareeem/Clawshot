# D35 (Kareem, round10): closed by default. Song-only keeps native ocarina play/learned-song
# checks but bypasses both quest gates; open uses the native gate module at Ready and an
# ungated child pedestal. Adult return/Prelude remain independent. Native trace: section41.

[exits."Temple of Time"."Beyond Door of Time"]
rule = "door_of_time == 'open' or (can_play(Song_of_Time) and (door_of_time == 'song_only' or (has_all_stones and (Ocarina, 2))))"
was = "can_open_door_of_time"
source = "D35 (Kareem, 2026-11-09); section41: patch.door pairs these modes with native altar/flow gates and the physical door/pedestal. Closed retains the three stones, Time ocarina and playable Time song; song_only permits either child ocarina; open has no inventory prerequisite. No Forest-return or Prelude gate is bypassed."
