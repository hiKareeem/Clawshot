source = "OoT Randomizer's adult way up from the blade room (the spike trap room jump, logic_dc_jump, or Hover Boots or Longshot) lands on the Bomb Bag ledge above the blade room, which the remake walls off from the bridge (WallCrack 13202633467597206724): exit Climb -> Bomb Bag Ledge carries the rule"

[exits."Dodongos Cavern Climb"."Dodongos Cavern Bomb Bag Ledge"]
rule = "is_adult and (logic_dc_jump or Hover_Boots or Longshot)"
new = true
source = "OoT Randomizer's rule (Dodongos Cavern.json:111), moved to the ledge it reaches: the Bomb Bag chest (39,116,-23) stands on the blade room's upper level (room 13), and Nintendo Life has Link leap from that ledge down onto the blade room's tall platforms. Adult only; that Hover Boots or the Longshot reach the ledge in the remake is not checked (question in the findings)"

