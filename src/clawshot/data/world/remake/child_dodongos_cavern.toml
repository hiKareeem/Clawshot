source = "OoT Randomizer's rule for leaving the upper Lizalfos (Dodongos Cavern.json:136, defeat the pair), plus the double eye-switch passage: Nintendo Life, IGN and QuestFern shoot one eye, cross, then the second eye through a window before the fire returns; data: room 17 holds two Obj_EyeSwitch_A_05 with LimitTime 10 and two Obj_DodongoCave_FireWall_A_01. The Slingshot (child) or Bow (adult) is already needed one room before (Before Upper Lizalfos -> Upper Lizalfos)"

[exits."Dodongos Cavern Bomb Bag Ledge"."Dodongos Cavern Upper Lizalfos"]
rule = "can_use(Slingshot) or can_use(Bow)"
new = true
source = "back through the double eye-switch passage: the two timed eye switches (LimitTime 10) and fire walls of room 17 are on this way too; OoT Randomizer's Far Bridge -> Upper Lizalfos was True"

[exits."Dodongos Cavern Bomb Bag Ledge"."Dodongos Cavern Far Bridge"]
