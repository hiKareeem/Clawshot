# Dodongo's Cavern, as the remake builds it (round 4, track A; the whole dungeon, both ages). Format:
# plans/04-world-format.md, "Overrides". Every rule of the area was checked; the findings file
# (E:/OOTRemake/work/r4-logic-child/findings/dodongos_cavern.md) lists what stays as OoT Randomizer has it.
#
# Guides (Switch 2 remake, 2026-11-05 to 07):
#   Nintendo Life, https://www.nintendolife.com/guides/zelda-ocarina-of-time-dodongo-cavern-walkthrough-switch-2
#   IGN, https://www.ign.com/wikis/ocarina-of-time-remake/Dodongo_Cavern_Dungeon_Walkthrough
#   QuestFern, https://questfern.com/oot/guides/dodongos-cavern-walkthrough/
#   VGC, https://www.videogameschronicle.com/guide/all-dodongos-cavern-gold-skulltula-locations-in-zelda-ocarina-of-time-switch-2/
#   Eurogamer and Polygon Gold Skulltula guides (local copies, E:/OOTRemake/work/r3/)
# Placement data: DodongoCavern_Static/_Dynamic, read by E:/OOTRemake/work/r4-logic-child/actors.py; coordinates in
# metres, y up; room = DefaultDungeonRoomIndex (1 main hall, 10 staircase room, 13 blade room with the Bomb Bag
# ledge, 16 upper Lizalfos, 17 double eye-switch passage, 18 Gold Skulltula side room, 21 cracked floor, 22 boss).

# The Bomb Bag ledge. OoT Randomizer's "Far Bridge" holds both the ledge with the Bomb Bag chest (reached from the
# upper Lizalfos through the double eye-switch passage) and the bridge over the skull with the lift switch. In the
# remake a bombable wall stands between them: data WallCrack 13202633467597206724 (room 13, (30,115,-23)) just west
# of the Bomb Bag chest (39,116,-23), then a gate (23,113,-23) and the lift switch Obj_StepSwitch_A_01
# 3277908769903275104 (17,112,-23) on the main hall's upper floor. "Far Bridge" stays the bridge side.

[regions."Dodongos Cavern Bomb Bag Ledge"]
area = "DodongoCavern"
dungeon = "Dodongos Cavern"
source = "remake: the Bomb Bag chest's ledge in the blade room (room 13 upper level) and the double eye-switch passage before it (room 17), cut off from the bridge over the skull by a bombable wall (WallCrack 13202633467597206724); Nintendo Life, IGN, QuestFern: bomb the wall behind the Bomb Bag chest to get back to the main hall"

