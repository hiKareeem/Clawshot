new = true
source = "Nintendo Life: bomb the wall west of the Bomb Bag chest to return to the main area; IGN: place a bomb at the cracked wall behind the chest, the lift switch is dead ahead; QuestFern: bomb the wall behind the chest. Data: WallCrack 13202633467597206724 (30,115,-23), no Bomb Flower on the ledge (the blade room's only one, (49,114,-12), is on the lower platforms). The Megaton Hammer on this wall is not checked"

[exits."Dodongos Cavern Far Bridge"."Dodongos Cavern Upper Lizalfos"]
