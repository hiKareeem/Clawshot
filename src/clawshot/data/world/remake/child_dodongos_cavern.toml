# Gold Skulltulas.

[locations."Dodongos Cavern GS Alcove Above Stairs"]
rule = "has_explosives"
was = "can_use(Hookshot) or can_use(Boomerang)"
source = "moved (plans/rounds/r3-census.md, 'Moved checks'): data Enemy_Skulltula_Gold 4565265801822094851 in room 18 at (21,112,-56), floor height (the room's two Enemy_Dodongo stand at y 112), behind WallCrack 1823997448213534774 (20,113,-44) off the bridge over the skull. Eurogamer and Polygon: Bombs required (child and adult), on the back of the rock spike; IGN: bomb the cracked wall in the hall's north-east corner, a detonating Dodongo can kill it; Nintendo Life, VGC: a bombable wall by the bridge. No guide asks for the Boomerang or Hookshot. The Megaton Hammer on this wall is not checked"

[locations."Dodongos Cavern GS Vines Above Stairs"]
rule = "at('Dodongos Cavern Climb', can_use(Slingshot) or can_use(Boomerang) or can_use(Bow) or can_use(Hookshot)) or (logic_dc_vines_gs and can_use(Longshot))"
was = "at('Dodongos Cavern Climb', True) or (logic_dc_vines_gs and can_use(Longshot))"
source = "data: Enemy_Skulltula_Gold 8470399761714006011 at y 120 on the climbing mesh, beside Enemy_Skullwalltula 6717968000149556429 (y 119), about 5 m above the upper floor by the door to the next room (y 115). IGN: hit them with the Slingshot, then climb the mesh for the token; Eurogamer: kill it before climbing up to its token; QuestFern: shoot it, then climb. Polygon lists no item. A ranged weapon is asked; the Boomerang, Bow and Hookshot are the usual Gold Skulltula weapons, not checked here (question in the findings)"

