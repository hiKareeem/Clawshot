# R14: the common entrance wall is shared by both ages, not an automatic adult bypass.
[events."ZR Behind Waterfall"."Zora River Domain Arrival"]
new = true
rule = "True"
source = "03-game-data.md section 48 (cs14e, e0f3ccfa): the free river-to-Domain transition is available from behind the waterfall. Both native entrance actors (8680147983491088093 child, 4848284814404943915 adult) bind Goto_ZoraDomain; Dm_SY_BancChangeArrive Event48 plays Dm_Zora_0000, then Event46 sends Get_StoneOfWater_MeetImpa=false to Event44/Step03 or true to Event45/Step03_Impa. Either reaches the common wall's cutoff. This event represents executing that transition, not owning its former reward or just reaching the river."

[exits."ZR Front"."Zora River"]
rule = "can_blast_or_smash or 'Zora River Domain Arrival'"
was = "is_adult or has_explosives"
source = "Kareem via Claude, 2026-11-13, paired Longshot check: adult Water=Ready/rock-broken=false is blocked; Step03/false is open, both after reload. Native ZoraRiver_Common_08f0 wall nodes 1/3/4/10/11/12/13 all create iff NOT(Zorariver_BrokenRock_Broken OR Water==Step03 OR Water>Step03). Either entrance rock's death sets that Bool. Obj_BrokenRock_A_01 inherits WallCrack; CrackStoneObject accepts Hammer damage, so retain the existing age-aware blast-or-smash helper. Lost Woods and reverse Domain routes are unchanged."

[locations."ZR GS Tree"]
region = "Zora River"
rule = "can_plant_bugs and can_child_attack"
was = "is_child and can_child_attack and can_bonk"
source = "03-game-data.md section 11: in the remake ZR GS Tree is the bean seller's soft soil; data: Enemy_Skulltula_Gold 12370559827741970774 (Enemy_Skulltula_Gold_IsMagicBeanSoil, AppearPopOut) at (-55,101,-12) on Obj_SmallFarm_A_02 (Gimmick_MagicBeanSoil_ZoraRiver02), beside the bean seller, past the entrance boulders; Eurogamer and Polygon GS guides and Nintendo Life GS #49: drop bugs into the soft soil by the bean seller. The rule is OoT Randomizer's for a soil Gold Skulltula (LH GS Bean Patch)"

[locations."ZR GS Ladder"]
rule = "is_child and ((at_night and 'Time Flows') or gold_skulls_ignore_daytime) and can_child_attack"
was = "is_child and (at_night or gold_skulls_ignore_daytime) and can_child_attack"
source = "Eurogamer, 17 changes: time does not flow until Link has met Zelda, so night needs the event 'Time Flows' (Main, round 4); data: Enemy_Skulltula_Gold 8695975724114049706 is Enemy_Skulltula_Gold_Nocturnal, at (113,112,-49) by the climbable ivy near the Domain waterfall; Eurogamer and Polygon GS guides: child, night"

[exits."Zora River"."ZR Storms Grotto"]
rule = "can_play(Song_of_Storms)"
was = "can_open_storm_grotto"
source = "Eurogamer, 17 changes (https://www.eurogamer.net/all-new-changes-zelda-ocarina-of-time-switch-2): every grotto entrance is visible and shows whether it needs a bomb or the Song of Storms; the Stone of Agony is now the Echo Gem, which finds Gold Skulltulas (Main, round 4). Data: Land_Kokiri_HidingHoleCover_A_01 5489068764052953067 covers the hole at (-78,99,-17)"

[locations."ZR Deku Scrub Grotto Rear"]
n64_only = "the remake's Song of Storms grotto (hole at (-78,99,-17), room at y 82) holds a gossip stone, butterflies that turn into a fairy and four pots, and no Enemy_Scrub_Business is placed anywhere in ZoraRiver (03-game-data.md section 5: no ZoraRiver scrub)"
source = "placement data, ZoraRiver_Child/_Adult_Static and _Dynamic"

