# R13 (proposed by cs13b from native data, kept vanilla at the user's request, 2026-11-12): every adult trade
# hand-in is a ShowItemReplaceEvent of its own item (SubEvent_GetSwordBigGoron Step03..Step11), and the shared
# trade cell Pa_ItemIcon_23 shows only one owned variant, chosen in PouchTable order (native 0xa6ef20): an adult
# shows the first owned adult-usable variant, a child the first owned variant usable at either age. The eleven
# adult variants precede Letter/AlarmCucco/WeirdEgg, so a shuffled adult item in a child gift hides the Cucco
