# Time of day: the remake's clock starts only once Link has met Zelda. Rules in other areas ask for this event
# with every child `at_night` / `at_dampe_time` (cross-area decision, Main, round 4).

[events."HC Garden Skippable Locations"."Met Child Zelda"]
rule = "is_child"
new = true
source = "Section46: Met Child Zelda models completion of the courtyard AND Impa lesson/accepted send-off through DoorOfTime Step02, not first courtyard contact. HyruleCastle_Prefab_941f requests the meeting at Goto_HyruleCastle Step04; Goto_HyruleCastle Event30/32 completes it and initializes DoorOfTime Step01. Step01 Impa talk starts Dm_MelodyGet_Zelda; the after-lesson talk Event124 reserves HyruleField_DoorOfTime_SendOff, whose Event7 writes Step02 without an additional inventory/stone test. Same route as HC Zeldas Letter and Song from Impa; Hyrule Castle Grounds -> HC Garden requires Weird Egg or Chicken (OoTR Overworld.json:1379), representing Talon's wake-up."

[events."HC Garden"."Time Flows"]
rule = "is_child and 'Met Child Zelda'"
new = true
source = "Eurogamer, 'all new changes' (https://www.eurogamer.net/all-new-changes-zelda-ocarina-of-time-switch-2): time does not start to flow until Link has met Princess Zelda; she is met in the castle garden (Npc_Hylia_Zelda_Child 13027585550451396507 at (5,128,-257); Nintendo Life Hyrule Castle guide, steps 8-10)"

# Grottos: every grotto entrance is visible in the remake and the Stone of Agony (now the Echo Gem) finds Gold
# Skulltulas, not grottos (cross-area decision, Main, round 4).

[exits."Hyrule Castle Grounds"."HC Storms Grotto"]
rule = "can_play(Song_of_Storms)"
was = "can_open_storm_grotto"
source = "Eurogamer, 'all new changes' (https://www.eurogamer.net/all-new-changes-zelda-ocarina-of-time-switch-2): every grotto entrance is visible, the Stone of Agony is the Echo Gem and finds Gold Skulltulas; Eurogamer and Polygon Gold Skulltula guides: play the Song of Storms by the lone tree near the crawlspace to open the hole; data: Land_Kokiri_HidingHoleCover_A_01 13073548223054495027 and HidingHole_Entry_01 at (36,117,-106) beside Obj_Tree_A_01 (33,117,-106); the only AgonyStoneReactArea (16549736856740418131) is inside the grotto at (38,95,-104), not at the entrance"
