source = "Banc room 0: the only lobby eye switch (Obj_EyeSwitch_A_02 11495024771723587729, above the entrance) drops the east chest 2436665354602612279 (GerudoTrainingGround_00_FallTreasureBox, TBox_Rupee_Blue; EG section 4: shoot the eye above the entrance, a chest with a Blue Rupee drops); the west chest 11182647876438515984 is Obj_TBox_GlassTruth_A_01 (Lens-only, always placed). Which OoT Randomizer name each takes is unconfirmed, so both lobby chests ask for the eye switch and the Lens until Kareem settles it."

