# Remake build e0f3ccfa, Gerudo Training Ground ("Gerudo Proving Grounds" in the remake). Generated
# gerudo_training_ground.toml stays untouched. Room numbers are DefaultDungeonRoomIndex in
# Banc/GerudoTrainingGround/*_{Static,Dynamic} (read only, cs4b helper, 2026-11-07); they follow N64's rooms
# (Stalfos 1, boulders 2, Wolfos 3, eye statue 4, hammer 5, lava 6, Beamos 7, maze 8, water 9, Like Likes 10).
# Walkthroughs: https://www.eurogamer.net/gerudo-proving-grounds-walkthrough-zelda-ocarina-of-time (EG) and
# https://zeldacentral.com/games/ocarina-of-time-remake/walkthrough/gerudo-proving-grounds/ (ZC).
# The maze keeps N64's door structure: EG spends 1/2/4/5/7 keys to the hidden-ceiling, purple, red, arrow and Ice
# Arrow chests (ZC: seven doors to the Ice Arrow), exactly OoT Randomizer's worst-order counts 3/4/6/7/9 minus the two
# other maze doors, so the maze key rules stand. The ninth key (N64's freestanding key) is the maze chest
# 1883068192328530224 by the lava-room door. Root override restoration is cs4a's fa9ed2b, census link cs4d's
# f3fb5ef; integration pending. Do not duplicate the root location entry here.

