[exits."Gerudo Training Ground Heavy Block Room"."Gerudo Training Ground Like Like Room"]
rule = "can_use(Silver_Gauntlets) and can_use(Bow) and can_use(Lens_of_Truth)"
new = true
source = "EG section 3: in the Wolfos room push the door-like cube into the hole to make a path, then with the Lenses hit the eye switch above the door. Banc room 3: Obj_MovableBox_A_04 Hash 4134330786473270162 (MovableBoxParam MovableBoxType hashes to NeedGauntletSilver, the actor of the Spirit Temple's silver blocks) before an answer position; the door's room-3 shutter opens by GerudoTrainingGround_03_ShutterOpen from Obj_EyeSwitch_GlassTruth_A_02 Hash 10731754838093134223 (Lens-only). Bow as for every other eye switch here; whether the Hookshot also triggers it (pack default isHitHookShot = true) is unverified."

