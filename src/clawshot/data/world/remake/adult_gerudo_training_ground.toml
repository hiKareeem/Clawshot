source = "EG section 3: from the Lens/Hookshot ledge (the Pierre ledge of room 4) go through the door behind Pierre to a Small Key chest = maze upper-floor chest 9911316961118170383 (Banc room 8, y 105). That door's shutter (12014808007378132009) opens with GerudoTrainingGround_Room04_StoneGimmick: the statue in the lava pool, shot with the Bow from the floor (EG section 2). Model the floor, Bow and return to the ledge: Pierre (EG: Scarecrow's Song there; ZC: Longshot to the scarecrow; about 18 units from AreaCanCallPierre) or a loop through the hot lava room with Goron Tunic, then the Wolfos room's Lens/Hookshot ledge."

