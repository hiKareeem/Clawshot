# The way out past the Iron Boots room: a pool behind the White Wolfos arena drops into Zora's Fountain's lake.

[exits."Ice Cavern End"."Zoras Fountain"]
rule = "can_use(Iron_Boots)"
new = true
source = "Nintendo Life Ice Cavern walkthrough: with the Iron Boots, sink into the small opening after the Iron Boots room for a shortcut back to Zora's Fountain; data: FieldAndDungeonEntranceEventRequestActor 10544815606216485062 at (-47,106,83), below the Obj_WaterPlane_A_01 surface (y 108) past the Wolfos room, goes to ZoraFountain start ZoraFountain_FromIceCavern_Backdoor (42,88,-54), under the fountain's water. Diving down without the boots is not checked"
