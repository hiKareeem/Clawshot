# Ice Cavern, as the remake builds it (round 4, track A; the dungeon is adult-only, Zora's Fountain is frozen only
# for adult Link, but the whole dungeon is this track's). Format: plans/04-world-format.md, "Overrides". Evidence per
# entry; the round file (plans/rounds/r4-logic-child.md) lists what was checked and left as OoT Randomizer has it.
