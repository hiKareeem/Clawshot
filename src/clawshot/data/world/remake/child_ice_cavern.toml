# E:/OOTRemake/work/r4-logic-child/actors.py), Banc coordinates in metres, y up; room = DefaultDungeonRoomIndex.

[locations."Ice Cavern Freestanding PoH"]
n64_only = "no heart piece in the remake's Ice Cavern: no Obj_Heart_Piece (or other heart-piece actor) in IceCavern_Static/_Dynamic and none in the census; the compass room (room 6) holds the compass chest, the Gold Skulltula, a Blue Fire font and two rupee pots frozen in red ice (Obj_RedIce_A_06 5982607659326270053) with a Sun's Song fairy; the remake's 36 heart pieces put none in a dungeon"
source = "data (IceCavern placement files, census); Nintendo Life Ice Cavern walkthrough (compass room: compass, Gold Skulltula, Blue Fire, rupee jars and a fairy behind red ice) and Heart Piece guide (36 pieces, none in the dungeons; Zora's Fountain's two are the iceberg and the lake bottom)"

