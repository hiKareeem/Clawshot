# Bombchu Bowling: the alley lady lets Link play only once the Stone of Fire quest is complete (Dodongo's Cavern
# beaten), and lends ten Bombchus per round. Prizes in order: Bombchus (first clear), a bigger Bomb Bag (second),
# the Heart Piece (third), then a red rupee. OoT Randomizer's explosives are kept (the conservative rule; King
# Dodongo's own rule asks for explosives anyway).

[locations."Market Bombchu Bowling First Prize"]
rule = "has_explosives and 'Defeat King Dodongo'"
was = "has_explosives"
source = "flow MiniGame_BombchuBowling, AfterWakeUp: Get_StoneOfFire_IsCompleted_Exp (the Stone of Fire quest enum at 'Complete', after BossBattle and EscapeDungeon) gates the offer, otherwise the lady refuses; Start: EventPlayerSetItemForMiniGame (10 rental items, ExplainRentalItem); GetPrise: second clear gives Item_BombBag_Medium (Item_BombBag_Large if held); Nintendo Life heart piece guide: bowling opens after Dodongo Cavern"

[locations."Market Bombchu Bowling Second Prize"]
rule = "has_explosives and 'Defeat King Dodongo'"
was = "has_explosives"
source = "flow MiniGame_BombchuBowling: Get_StoneOfFire_IsCompleted_Exp gates the game; GetPrise: third clear gives Obj_Heart_Piece (HeartPieceAnchor MiniGame_BombchuBowling_ClearThirdTime at (-22,110,9)); Nintendo Life heart piece guide: after Dodongo Cavern, one prize is a Heart Piece"

[locations."Market Bombchu Bowling Bombchus"]
rule = "found_bombchus and 'Defeat King Dodongo'"
was = "found_bombchus"
source = "flow MiniGame_BombchuBowling: Get_StoneOfFire_IsCompleted_Exp gates the game; GetPrise: first clear gives Item_BombchuBundle_Medium"

[locations."Market Bombchu Bowling Bomb"]
rule = "has_explosives and 'Defeat King Dodongo'"
was = "has_explosives"
source = "flow MiniGame_BombchuBowling: Get_StoneOfFire_IsCompleted_Exp gates the game; GetPrise: every clear after the third gives Obj_Rupee_Red"

# Shooting gallery: the child prize is a bigger bullet bag, never the Slingshot (the gallery lends one).

[locations."Market Shooting Gallery Reward"]
vanilla_fixed = "Bullet Bag (40)"
source = "flow MiniGame_HitTarget, Child_Reward: Item_BulletBag_Medium (Item_BulletBag_Large if the Medium bag is held), once (MiniGame_HitTarget_HrlCity_Get_BulletBag), then rupees; no check for Item_Range_SlingShot, the game equips its own (EventPlayerSetItemForMiniGame, 15 shots). As the Lost Woods target game (remake.toml). OoT Randomizer's progressive Slingshot here let the logic give a child a Slingshot for free"
