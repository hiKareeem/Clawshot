# Hyrule Castle Market (Banc folder Market), child side, as the remake builds it (round 4, track A). Format:
# plans/04-world-format.md, "Overrides". What was checked and left as OoT Randomizer has it:
# E:/OOTRemake/work/r4-logic-child/findings/market.md.
#
# Sources:
# - Nintendo Life, "All Heart Piece locations" (Switch 2), 2026-11-06,
#   https://www.nintendolife.com/guides/zelda-ocarina-of-time-heart-piece-locations-switch-2
# - Nintendo Life, walkthrough hub (Switch 2), https://www.nintendolife.com/guides/zelda-ocarina-of-time-walkthrough-switch-2-remake
# - Eurogamer, "All new changes in the Ocarina of Time remake", https://www.eurogamer.net/all-new-changes-zelda-ocarina-of-time-switch-2
# - Event flows (romfs EventFlow, decoded in E:/OOTRemake/work/r1-research/decoded/evfl_all.json): a switch's case 0
#   is "yes" (the shops' opening-hours checks only read sensibly that way: each hour range answered in case 0
#   gets its own "closed" line, and the last case 1 is an error branch).
# - Placement data (Market_Child_Static/_Dynamic, read by E:/OOTRemake/work/r4-logic-child/actors.py), Banc
#   coordinates in metres, y up.

# Night: the remake's clock starts only once Link has met Zelda ('Time Flows', child_hyrule_castle.toml;
# cross-area decision, Main, round 4), so every child night rule asks for it.

[locations."Market Night Red Rupee Crate"]
rule = "is_child and (at_night and 'Time Flows') and (deadly_bonks != 'ohko' or Fairy or (can_use(Nayrus_Love) and shuffle_overworld_entrances == 'off'))"
