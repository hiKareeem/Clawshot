# Inside the Deku Tree, as the remake builds it (round 4, track A, cs4a). Format: plans/04-world-format.md,
# "Overrides". Evidence per entry; the round file (plans/rounds/r4-logic-child.md) lists what was checked.
#
# OoT Randomizer's "Deku Tree Lobby" holds floors 1 to 3. In the remake the climb from 2F to 3F passes a vine wall
# with Skullwalltulas cleared by the Slingshot or Boomerang (Kareem, 2026-11-08). The basement opens only by
# dropping from 3F into the 1F web, so either weapon is needed for that route. Round 3 seed 3 had neither
# available before the basement and was not beatable in game (plans/00-roadmap.md, "Round 3 result").
#
# Guide: Nintendo Life, "Great Deku Tree walkthrough" (Switch 2), 2026-11-05,
# https://www.nintendolife.com/guides/zelda-ocarina-of-time-great-deku-tree-walkthrough-switch-2
# Placement data (InsideTheDekuTree_Static/_Dynamic, read by E:/OOTRemake/work/r4-logic-child/actors.py), Banc
# coordinates in metres, y up; room = DefaultDungeonRoomIndex.

[regions."Deku Tree Top Floor"]
area = "InsideTheDekuTree"
dungeon = "Deku Tree"
source = "remake: 3F of the lobby (room 0 above y 120, Skulltulas at y 127) and the compass room (room 3: compass chest y 120, side chest y 126, Gold Skulltula y 121, the floor switch Obj_StepSwitch_A_02 and three Obj_InsideTheDekuTree_ElevatorLift platforms); Nintendo Life guide, 'Compass (3F)'"

[exits."Deku Tree Lobby"."Deku Tree Top Floor"]
rule = "can_use(Slingshot) or can_use(Boomerang)"
new = true
source = "Kareem in game via Claude, 2026-11-08, seed-shop-7 (build e0f3ccfa, Hookshot 2.0.1): the Boomerang clears the vine wall to 3F as the Slingshot does. Data: room 0 Enemy_Skullwalltula Hashes 2729587378952040865, 16183956171357380613 and 3995458350586152163 at y 113-116 between the map chest and 3F. Bow/Hookshot alternatives remain unverified"

[exits."Deku Tree Top Floor"."Deku Tree Lobby"]
rule = "True"
new = true
source = "Nintendo Life guide: back down through the switch room to 3F's central column; the vine wall leads down to 2F"

[exits."Deku Tree Top Floor"."Deku Tree Basement"]
rule = "here(is_adult or can_child_attack or Nuts)"
new = true
source = "Nintendo Life guide, 'Jumping into the spider web (3F to B1)': from 3F's central column, jump onto the 1F web (Obj_InsideTheDekuTree_SpiderWeb_A_01, room 0, y 100) to fall into B1. The condition is OoT Randomizer's for the lobby's way down (Deku Tree.json:20), kept"

[exits."Deku Tree Lobby"."Deku Tree Basement"]
