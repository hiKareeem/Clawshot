# The Great Fairies of Death Mountain Trail and Hyrule Castle swapped gifts (confirmed in game by Kareem,
# 2026-11-07, 03-game-data.md sections 5 and 9; the data agrees, section 12: the Hyrule Castle fountain's
# Obj_TriForcePoint_A_01 runs Demo_FairyFountain_Power, whose fairy gives Item_FairyBless_MP). Zelda's Lullaby calls
# every fairy but Din's only once Din's Fire is held; the other fountains' rules are in their area files.

[locations."DMT Great Fairy Reward"]
vanilla = "Dins Fire"
source = "Kareem, in game, 2026-11-07: the Death Mountain Trail fountain gives Din's Fire (03-game-data.md section 9)"

[locations."HC Great Fairy Reward"]
vanilla = "Magic Meter"
rule = "can_play(Zeldas_Lullaby) and Dins_Fire"
was = "can_play(Zeldas_Lullaby)"
source = "Kareem, in game, 2026-11-07: the Hyrule Castle fountain gives the magic meter (03-game-data.md section 9). Rule: event flow TriForcePoint, entry Sub_PlayOcarinaSequence_FairyFountain: after the Lullaby, EventQueryFairyFountainSelectSpecialAbility sends every fountain but Din's (SpecialAbility 2) to a switch on IsGet.Item_DinFire; without it Navi says 'It doesn't seem like anything happened' (Dm_FairyFountain_Power Talk_00/Talk_02) and the fairy stays away. Fee: Dm_FairyFountain_Power asks EventQueryHasRuppe 50 and pays -50 (GreatFairy_Price2 = 50); the starting wallet holds 200 (Item_Wallet_Small)"

# The magic meter comes with every magic item (round 4 item 6, 03-game-data.md section 12). Each item's
# PouchActorInfo row has `ExpansionAvility: MPMaxUP` with `MPMax: 24` (Item_FairyBless_MP, OoT Randomizer's
# Magic Meter, too; Item_FairyBless_MPDouble 48), and the item-get flow `Dm_SY_Get:PouchAddItem` calls `MPOpen`, which
# shows the magic gauge being born when `PlayerStatus.MPMax` is 0. So a rule asking for Magic_Meter is met by any of
# them, wherever it was found.

[items."Dins Fire"]
alias = ["Magic Meter", 1]
source = "RSDB PouchActorInfo Item_DinFire: ExpansionAvility MPMaxUP, MPMax 24; the Death Mountain Trail fairy's gift flow (Dm_SY_GetInEvent:GetInEvent_GreatFairyDin) shows the magic gauge born when the player had none (GreatFairy_HasNoMPOnDinDemo)"

[items."Farores Wind"]
alias = ["Magic Meter", 1]
source = "RSDB PouchActorInfo Item_FaroreWind: ExpansionAvility MPMaxUP, MPMax 24"

[items."Nayrus Love"]
