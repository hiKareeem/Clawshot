# Small keys: the census counts each dungeon's small keys (chests and freestanding), and the locked doors agree
# (Obj_DoorChainLock_A_01 actors, one on each side of a door: BottomOfTheWell 4, WaterTemple 8, InsideGanonCastle
# 2; read from the Static placement files, plans/rounds/r3-world.md). Where the remake has fewer keys than N64 it
# has as many fewer locked doors, so no door needs more keys than the dungeon holds: a rule asking for more is
# capped at the remake's count. Which N64 doors are gone is not known; the cap never asks for fewer keys than the
# remake's doors need, as long as the remake's locked doors are N64 doors. Dungeons with N64's count are not listed.

[key_counts]
"Small Key (Bottom of the Well)" = { count = 2, source = "census: one Item_Dungeon_SmallKey chest and the freestanding Obj_Dungeon_SmallKey (N64: 3); 4 chain locks = 2 doors" }
"Small Key (Water Temple)" = { count = 4, source = "census: 4 Item_Dungeon_SmallKey chests (N64: 6; 03-game-data.md section 9); 8 chain locks = 4 doors" }
"Small Key (Ganons Castle)" = { count = 1, source = "census: 1 Item_Dungeon_SmallKey chest (N64: 2); 2 chain locks = 1 door" }
