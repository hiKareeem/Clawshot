# Which OoT Randomizer regions the translator (python -m clawshot.world.translate) writes into which world file.
# OoT Randomizer: https://github.com/OoTRandomizer/OoT-Randomizer (MIT), data/World/*.json.
# Round 3 ports the whole world: every region of Overworld.json, Bosses.json and the vanilla dungeons (Master Quest
# is left out). The translator reports any region of those files that no entry below names.
#
# Per file: `area`, the remake's Banc folder its regions lie in (the census `area` of their checks; grottos are in
# the overworld folder they open from, Lake Hylia and Lon Lon Ranch in HyruleField, the Temple of Time in Market,
# Ganon's Tower in InsideGanonCastle: 03-game-data.md section 1), and `regions`, by OoT Randomizer source file.
# A boss room goes with its dungeon (the boss heart container is placed in the dungeon's own Banc folder).

ootr_commit = "526b4c8d81b7c4023ef4573ffbaf39344e270d5b"

# The start regions and the warp-song and Farore's Wind arrival points: no checks, no area.
[files."root.toml".regions]
"data/World/Overworld.json" = [
    "Root",
    "Root Exits",
    "Child Spawn",
    "Adult Spawn",
    "Prelude of Light Warp",
    "Minuet of Forest Warp",
    "Bolero of Fire Warp",
    "Serenade of Water Warp",
    "Nocturne of Shadow Warp",
    "Requiem of Spirit Warp",
    "Farores Wind Warp",
]

