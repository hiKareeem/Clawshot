[opening]
name = "Deku Tree"
event = "Defeat Queen Gohma"
region = "Deku Tree Lobby"
age = "child"
# A presentation milestone, not another access rule: route.py proves it through the existing world/search.

[[opening.visit]]
event = "Deku Shield"
region = "KF Kokiri Shop"
name = "Kokiri shopkeeper's free Deku Shield"
where = "Kokiri Forest, Kokiri Shop: talk to the child shopkeeper at the counter, not a shelf. First pass Mido, talk to the Great Deku Tree to advance the meeting quest, then return to the shop."
opens = "Child Link, after the Deku Tree meeting quest advances; before Gohma/Forest Stone or the castle-visit quest is completed"
not_equipped = "Deku Shield"
source = "Kareem in game via Claude, 2026-11-08, seed-shop-7; plans/03-game-data.md section 12, GIFT02. child_kokiri_forest.toml event at KF Kokiri Shop proves access. present_DekuSheld Event45 checks equipped Deku Shield, not ownership; both grant branches give Obj_Shield_Deku, without a purchase."

# Readable check labels, directions and provenance; no game resources.
# World/OoTR keys and physical Hash/flow identities are unchanged.
# floor: map-floor label from Banc/BancBasedResource/MapParam.byml.zs, build e0f3ccfa.
# Match chest TBox.InstanceID before singleton Room.Floor; 0=1F, -1=B1.
# Floor is presentation only; identities, exclusions and logic are unchanged. See section39.

[[location]]
location = "KF Shopkeeper Gift"
name = "Kokiri Shopkeeper Gift"
where = "Kokiri Forest, Kokiri Shop: pass Mido, talk to the Great Deku Tree, then return to the child shopkeeper at the counter. When shuffled, the uncollected gift remains available after Gohma and the castle visit."
oot_randomizer_name = ""
source = "plans/03-game-data.md sections 28 and 34; Kareem via Claude, 2026-11-09, shopkeeper-after-gohma-next on a ranch-save copy after Forest stone and Zelda's Lullaby: Boomerang granted with Deku Shield owned, no repeat. Gift/NPC shuffle uses the saved first-talk Bool for both Event116/117 and extends the window; unshuffled keeps the native early free-shield event. D28 lifted for the shuffled check."
ids = ["Npc_Kokiri_001_Shop_Child/Event116", "Npc_Kokiri_001_Shop_Child/Event117"]
# Directions identify checks, not a guarantee of access: exclusions/rules remain in world data.
# All four Mido doorway labels are settled in game by Kareem, 2026-11-08 (section 20).

# Shop labels face the shopkeeper from the customer side: top/bottom row, far/inner left/right.
# Shelf orientation is placement-derived, calibrated to Kareem's doorway handedness; not a new in-game shop observation.
# Static directions deliberately omit vanilla rewards and prices: placements/settings can change them.

# Order: chests, shops, other gifts/songs, Great Fairies; ordering is presentation only.

# Four opt-in Scrub once-sale families follow; they do not enable Token or repeated vendors.

