# Gossip Stone hints (round 7, cs7a): how many of each kind, which locations always or sometimes get a hint, the hint
# areas' names, each stone's player-facing place, and Clawshot's own wording. No game text: area and item names in a
# seed's lines come from this file and from the player's dump (the item's own name) at generation time.
#
# Hint kinds (generate/hints.py), after OoT Randomizer's (Hints.py at 526b4c8d, MIT):
#   always    a listed location, every one that is shuffled, before the rest
#   woth      an area holding an item the goal cannot be reached without ("Way of the Hero")
#   barren    an area where no shuffled location holds an item that can unlock anything ("foolish")
#   item      where a major item is (its area); one hint per item, not one per copy
#   sometimes a listed location and its item
#   random    any shuffled location and its item
#   junk      a line that says nothing
# A hint naming a location is placed only on a stone readable with every other item collected (OoT Randomizer's
# can_reach_hint), so the stone never needs the item it points at.

[distributions.balanced]
source = "OoT Randomizer data/Hints/balanced.json at 526b4c8d: woth 3.5, barren 2, random 6, item 5, junk 3, dungeon woth limit 2, barren limit 1; its song (1), overworld (2) and dungeon (1.5) kinds draw from the sometimes list here (4.5); entrance hints (3) need entrance shuffle and are left out; copies 1"
dungeon_woth_limit = 2
dungeon_barren_limit = 1
weights = { woth = 3.5, barren = 2.0, item = 5.0, sometimes = 4.5, random = 6.0, junk = 3.0 }

[distributions.strong]
source = "OoT Randomizer data/Hints/strong.json at 526b4c8d: woth 3, barren 3, random 2, item 1, song 0.33 + overworld 0.66 + dungeon 0.66 as sometimes (1.65), no junk; copies 1 here (2 there for woth)"
dungeon_woth_limit = 2
dungeon_barren_limit = 1
weights = { woth = 3.0, barren = 3.0, item = 1.0, sometimes = 1.65, random = 2.0, junk = 0.0 }

[distributions.useless]
source = "OoT Randomizer data/Hints/useless.json at 526b4c8d: every stone a junk line"
dungeon_woth_limit = 0
dungeon_barren_limit = 0
always = false
weights = { junk = 1.0 }

