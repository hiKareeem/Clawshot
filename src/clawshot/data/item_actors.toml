# The remake actor a chest's Dynamic.Drop__DropActor takes for each logic item (an items.toml or world.toml name)
# a chest can be given, and so, read backwards, the logic item a chest the remake fills with that actor holds.
# Chest seeds move actors already used by chests. Opt-in Shop seeds also move native shop pouch actors listed
# below; those grants still require their in-game family checks (D15). Loaded by clawshot.patch.items.
#
# Derived from the census chests linked to OoT Randomizer (src/clawshot/data/locations.toml oot_randomizer_name):
# the census vanilla_item against LocationList.py's vanilla item for that name (commit
# 526b4c8d81b7c4023ef4573ffbaf39344e270d5b). `source` names the linked location(s) a pair comes from; where no
# linked chest holds the item, the census chests that hold the actor. Pairs where the remake gives something else
# than N64 (OoT Randomizer "Recovery Heart" chests hold nuts, sticks or a blue rupee) are listed in
# plans/rounds/r3-seed.md; they are content changes, not other actors for that item.
#
# Within a dungeon's own items (maps, compasses, keys) one actor serves every dungeon: the backwards lookup takes
# the item of the chest's own dungeon. Any other actor appears once.

