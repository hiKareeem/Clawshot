# Presentation only. Defaults and validation remain in Settings/data/settings.toml.
[shuffle]
label = "What to shuffle"
kind = "multi"
display = "cards"
status_labels = { on = "Shuffled", off = "Vanilla" }
choices = ["Chest", "Shop", "Gift", "Scrub", "BossHeart", "Freestanding", "Token"]
group = "Items"
help = "Choose which kinds of checks share the item pool. Focus a card for its coverage and current playtest limits."
[dungeon_items]
label = "Dungeon items"
kind = "choice"
choices = ["own_dungeon", "anywhere"]
group = "Items"
help = "Keys, maps and compasses stay in their own dungeon. Anywhere is held until named-dungeon grants pass in game."
[songs]
label = "Song placement"
kind = "choice"
choices = ["song", "anywhere"]
group = "Items"
help = "Keep songs on song checks, or allow them among other supported checks."
[forest]
label = "Kokiri Forest"
kind = "choice"
choices = ["closed", "closed_deku", "open"]
group = "World"
help = "Closed is vanilla-like; closed_deku opens the bridge; open also bypasses Mido."
clears = { logic = ["open_forest", "skip_mido"] }
[door_of_time]
label = "Door of Time"
kind = "choice"
choices = ["closed", "song_only", "open"]
group = "World"
help = "Closed needs stones, Time ocarina and song. Early-door modes still require the strict adult-return proof. In-game acceptance pending."
clears = { logic = ["door_of_time"] }
[fast_start]
label = "Fast start"
kind = "multi"
choices = ["intro", "saria", "deku_tree", "kaepora"]
display = "cards"
status_labels = { on = "Skipped", off = "Plays" }
group = "World"
help = "Skippable opening scenes. Forest control uses the separate forest setting. Empty disables all skips."
[shop_prices]
label = "Shop prices"
kind = "choice"
choices = ["vanilla", "affordable"]
group = "Prices"
help = "Affordable makes selected shuffled shelves cost 10 rupees."
enabled_when = [{ key = "shuffle", contains = "Shop", reason = "Shuffle shop shelves to change their prices." }, { key = "shop_slots", greater_than = 0, reason = "Select at least one shuffled shelf per shop to change its price." }]
[shop_slots]
label = "Shuffled shelves per shop"
kind = "integer"
min = 0
max = 8
group = "Prices"
help = "First N native shelves in each ordinary shop; other stock stays vanilla."
enabled_when = [{ key = "shuffle", contains = "Shop", reason = "Shuffle shop shelves to choose how many shelves change." }]
[scrub_prices]
label = "Scrub prices"
kind = "choice"
choices = ["vanilla", "fixed"]
group = "Prices"
help = "Price policy for the supported saved once-sales, not repeat vendors."
enabled_when = [{ key = "shuffle", contains = "Scrub", reason = "Shuffle one-time scrub sales to change their prices." }]
[scrub_price]
label = "Fixed scrub fee"
kind = "integer"
min = 0
max = 1000
group = "Prices"
help = "Rupees charged when scrub prices are fixed."
enabled_when = [{ key = "shuffle", contains = "Scrub", reason = "Shuffle one-time scrub sales to set a fee." }, { key = "scrub_prices", equals = "fixed", reason = "Choose Fixed fee for scrub prices to use this amount." }]
[cheap_deku_shield]
label = "Affordable Deku Shield"
kind = "boolean"
group = "Prices"
help = "Kokiri shop's Deku Shield costs 10, even with shops unshuffled."
[hints]
label = "Gossip Stones"
kind = "choice"
choices = ["always", "mask"]
group = "Hints"
help = "Speak without the Mask of Truth, or retain the native mask requirement."
[hint_distribution]
label = "Hint distribution"
kind = "choice"
choices = ["balanced"]
group = "Hints"
help = "Named distribution from data/hints.toml."
[logic]
label = "Logic overrides (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced world overrides, for example {\"free_time_travel\": true}. Free travel is experimental and off by default. N64 tricks remain refused."
[areas]
label = "Playtest areas (JSON array)"
kind = "json"
group = "Advanced"
help = "Banc area names for a slice. Requires a goal. Empty selects the whole world."
[goal]
label = "Playtest goal"
kind = "nullable-text"
group = "Advanced"
help = "Rule for a slice, not a change to the whole-world goal. Leave empty normally."
[item_location_types]
label = "Item destination restrictions (JSON object)"
kind = "json"
group = "Advanced"
help = "Map item names to arrays of allowed check types; effective seed strings may contain derived restrictions."
[exclusive_location_types]
label = "Exclusive check types (JSON array)"
kind = "json"
group = "Advanced"
help = "Check types accepting only items explicitly held to them. Normally derived by gift setup."
[location_type_items]
label = "Native pickup palettes (JSON object)"
kind = "json"
group = "Advanced"
help = "Map check types to arrays of native item names. Physical patches still enforce their supported palette."

