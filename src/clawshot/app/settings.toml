# Sources: plans/playtest/answers.md R7-BOSSHEART, R8-FREESTANDING, R8-FROGS;
# plans/03-game-data.md sections 19, 21, 23, 34, 36, 40.
# Check totals come from generation, not duplicated metadata that goes stale with new checks.
[shuffle.choice_help]
Chest = "Chests across the remake. Chest swaps, including large rewards in small chests, have been checked in game. Trap chests and the Treasure Chest Game's ordinary boxes stay vanilla."
Shop = "Shelves in ordinary shops. Only items with native shop displays are used. Kokiri purchases and affordable prices have been checked in game; mask loans stay vanilla."
Gift = "Supported NPC gifts and songs, including Great Fairies, frogs and minigame prizes. Fairy once-only rewards and the supported frog checks have been played. The current generator decides which gifts can move; unsupported checks stay vanilla."
Scrub = "Saved, one-time scrub sales; repeat vendors stay vanilla. Price and reward changes pass data checks, but the isolated shuffled-purchase gameplay check is still pending."
BossHeart = "Boss heart pickups, limited to hearts, heart pieces, shields or a red rupee. King Dodongo's replacement shield was collected without an extra heart and did not return in Kareem's test."
Freestanding = "Saved floor heart-piece pickups, limited to the same native pickups as boss hearts. The ranch tower's replacement shield was collected and equipped with no extra heart piece in Kareem's test."
Token = "Gold Skulltulas still give their original tokens. A replacement test counted as a token instead of giving the requested item, so tokens cannot be shuffled yet."
[dungeon_items.choice_help]
own_dungeon = "Keep each dungeon's keys, maps and compasses in that dungeon."
anywhere = "Allow dungeon items outside their own dungeon once the intended-dungeon key grant works in game; this mode is not available yet."
[songs.choice_help]
song = "Keep songs on the supported song checks."
anywhere = "Allow songs among supported shuffled checks. Storms and Minuet have been used from chests; other songs share the same grant path."
[forest.choice_help]
closed = "Keep Mido's sword-and-shield check and the bridge closed until Gohma, like the original route."
closed_deku = "Open only the forest bridge; Mido still guards the Deku Tree. This bridge behavior has been checked in game."
open = "Open the bridge and bypass Mido's sword-and-shield check."
[door_of_time.choice_help]
closed = "Require all three stones, Ocarina of Time and the playable Song of Time."
song_only = "Allow either child ocarina and the learned Song of Time to open the door. Its first in-game door check passed; returning to child with an early door is untested."
open = "Open the door without the stones or song. Its first in-game door check passed; returning to child with an early door is untested. The strict adult-return proof still applies."
[fast_start.choice_help]
intro = "Allow the new game's opening introduction to be skipped. The intro skip has been checked in game."
saria = "Allow Saria's opening scene to be skipped; this does not grant an item or change forest access."
deku_tree = "Allow the Deku Tree's opening talk to be skipped; its entrance requirements are unchanged."
kaepora = "Allow the selected Kaepora introductions to be skipped; routes and item requirements are unchanged."
[shop_prices.choice_help]
vanilla = "Keep native prices on shuffled shop shelves."
affordable = "Charge exactly 10 rupees on each selected shuffled shelf; other shelves keep their prices."
[scrub_prices.choice_help]
vanilla = "Keep the supported once-sale scrubs' native 40/100-rupee fees."
fixed = "Use the fixed scrub fee for supported shuffled once-sales, without changing repeat vendors."
[hints.choice_help]
always = "Allow Gossip Stones to speak without the Mask of Truth."
mask = "Keep the native requirement: child Link must wear the Mask of Truth to read a stone."
[hint_distribution.choice_help]
balanced = "Use a balanced mix of useful location, region and item hints."
strong = "Use the generator's stronger hint distribution."
useless = "Use the generator's deliberately unhelpful hint distribution."
