# Presentation only. Defaults and validation remain in Settings/data/settings.toml.
[shuffle]
label = "What to shuffle"
kind = "multi"
display = "cards"
status_labels = { on = "Shuffled", off = "Vanilla" }
choices = ["Chest", "Shop", "Gift", "Scrub", "BossHeart", "Freestanding", "Token"]
group = "Items"
help = "Choose where you want to find shuffled rewards. Point at a card to see what it includes and what has been tried in game."
[dungeon_items]
label = "Dungeon items"
kind = "choice"
choices = ["own_dungeon", "anywhere"]
group = "Items"
help = "Choose whether small keys stay in their own dungeon or can be in chests anywhere. Boss keys, maps and compasses always stay in their own dungeon."
[songs]
label = "Song placement"
kind = "choice"
choices = ["song", "anywhere"]
group = "Items"
help = "Find songs at the usual song rewards, or mix them into the other places you shuffle."
[forest]
label = "Kokiri Forest"
kind = "choice"
choices = ["closed", "closed_deku", "open"]
group = "World"
help = "Leave Mido and the forest bridge closed, open just the bridge, or open both."
clears = { logic = ["open_forest", "skip_mido"] }
[door_of_time]
label = "Door of Time"
kind = "choice"
choices = ["closed", "song_only", "open"]
group = "World"
help = "Choose whether the door needs the Spiritual Stones, Ocarina of Time and Song of Time, just the song and an ocarina, or nothing. All three door modes have passed a first in-game check."
clears = { logic = ["door_of_time"] }
[fast_start]
label = "Fast start"
kind = "multi"
choices = ["intro", "saria", "deku_tree", "kaepora"]
display = "cards"
status_labels = { on = "Skipped", off = "Plays" }
group = "World"
help = "Choose which opening scenes to skip. Skipped shortens the opening; Plays leaves the usual scene. Forest access has its own setting."
[shop_prices]
label = "Shop prices"
kind = "choice"
choices = ["vanilla", "affordable"]
group = "Prices"
help = "Make the shop shelves you shuffle cost 10 rupees each."
enabled_when = [{ key = "shuffle", contains = "Shop", reason = "Shuffle shop shelves to change their prices." }, { key = "shop_slots", greater_than = 0, reason = "Select at least one shuffled shelf per shop to change its price." }]
[shop_slots]
label = "Shuffled shelves per shop"
kind = "integer"
min = 0
max = 8
group = "Prices"
help = "Choose how many shelves in each ordinary shop can hold shuffled items. Other wares stay as usual."
enabled_when = [{ key = "shuffle", contains = "Shop", reason = "Shuffle shop shelves to choose how many shelves change." }]
[scrub_prices]
label = "Scrub prices"
kind = "choice"
choices = ["vanilla", "fixed"]
group = "Prices"
help = "Keep the usual fees or set one price for the one-time scrub sales you shuffle. Repeat vendors do not change."
enabled_when = [{ key = "shuffle", contains = "Scrub", reason = "Shuffle one-time scrub sales to change their prices." }]
[scrub_price]
label = "Fixed scrub fee"
kind = "integer"
min = 0
max = 1000
group = "Prices"
help = "The price for the one-time scrub sales you shuffle when Fixed fee is selected."
enabled_when = [{ key = "shuffle", contains = "Scrub", reason = "Shuffle one-time scrub sales to set a fee." }, { key = "scrub_prices", equals = "fixed", reason = "Choose Fixed fee for scrub prices to use this amount." }]
[cheap_deku_shield]
label = "Affordable Deku Shield"
kind = "boolean"
group = "Prices"
help = "Buy the Deku Shield at Kokiri Shop for 10 rupees, even if you leave shop items unchanged."
[hints]
label = "Gossip Stones"
kind = "choice"
choices = ["always", "mask"]
group = "Hints"
help = "Let Gossip Stones speak without the Mask of Truth, or require you to wear it."
[hint_distribution]
label = "Hint distribution"
kind = "choice"
choices = ["balanced"]
group = "Hints"
help = "Choose how helpful the Gossip Stone clues are."
[logic]
label = "Logic overrides (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced: change which routes the generator assumes you can use. Leave this alone for normal play. Free back-and-forth time travel is experimental, and untested tricks are not allowed."
[areas]
label = "Playtest areas (JSON array)"
kind = "json"
group = "Advanced"
help = "Advanced: list game-file area codes for a short playtest and set a goal too. Leave empty to include the whole game."
[goal]
label = "Playtest goal"
kind = "nullable-text"
group = "Advanced"
help = "Set the finish condition for a short playtest. Leave blank for a normal whole-game seed."
[item_location_types]
label = "Item destination restrictions (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced: limit where particular items can appear. Usually filled in automatically; leave these values alone for normal play."
[exclusive_location_types]
label = "Exclusive check types (JSON array)"
kind = "json"
group = "Advanced"
help = "Advanced: reserve the listed kinds of reward spots for specially assigned items. Leave automatic values alone for normal play."
[location_type_items]
label = "Pickup replacements (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced: choose which items floor drops and boss hearts can become. The game can handle only certain replacements."

