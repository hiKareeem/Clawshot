# Sources: plans/playtest/answers.md R7-BOSSHEART, R8-FREESTANDING, R8-FROGS;
# plans/03-game-data.md sections 19, 21, 23, 34, 36, 40.
# Check totals come from generation, not duplicated metadata that goes stale with new checks.
[shuffle.choice_help]
Chest = "Chests across the remake. Finding a different item in a chest, including a large reward in a small chest, has been tried in game. Trap chests and the Treasure Chest Game's ordinary boxes stay as usual."
Shop = "Shelves in ordinary shops, using items the shop can display properly. Refills, ammo, bottle contents, hearts and magic sold in shops only ever appear on shop shelves. Kokiri purchases and affordable prices have been tried in game. Mask loans stay as usual."
Gift = "Gifts from characters and song rewards, including Great Fairies, frogs, minigames and the adult Rolling Goron's and King Zora's tunic gifts. Fairy rewards that can be collected only once, the supported frog rewards, the shuffled 40-token House reward and both tunic gifts have been tried in game. With chests shuffled, eight played gift items, such as Light Arrows and Biggoron's Sword, can also be found in chests, never at scrub sales. Not every gift or replacement item has been played; held checks stay unchanged."
Scrub = "One-time Deku Scrub purchases. Repeat vendors do not change. The adult Mirror Shield purchase that previously froze now finishes in game; not every reward or age combination has been played."
BossHeart = "Heart containers after bosses can become hearts, heart pieces, shields, a red rupee, either ocarina or (with songs anywhere) a song. King Dodongo's replacement shield was collected without adding a heart and did not return in Kareem's test. At Queen Gohma's heart, only the Fairy Ocarina was played. Prelude of Light and Zelda's Lullaby were picked up and did not respawn, but using those song rewards was not demonstrated. Ocarina of Time at a boss heart is unplayed."
Freestanding = "Heart pieces lying around the world can become the same items as boss hearts. The ranch tower's replacement shield was collected and equipped without adding a heart piece in Kareem's test."
Token = "Gold Skulltulas can give other rewards, and tokens can be found in shuffled chests; needs Chest shuffle, off in both presets. All 100 native sources take part. Played families allow tokens, fixed majors/equipment, new bottles, all rupee colours, hearts/capacity, ordinary ammo/Bombchus, magic jars/spells/arrows, Lens, Echo Gem, Double Defense, Scrub Business Seed, both ocarinas and, with songs anywhere, the twelve songs. Each member still needs its own native structural check. Ammo needs an existing container; Bombs/Bombchus need a Bomb Bag (D25), never a free bag or weapon. Progressive copies/tiers, keys/maps/compasses, Buy*/shop stock, trade items and Gerudo Pass stay excluded at Skulltulas. Field/ranch trees work by day; tower needs night/retrieval; wetlands needs child kill then adult crate. Seed use without buying does not consume it."
[dungeon_items.choice_help]
own_dungeon = "Find a dungeon's keys, maps and compasses only inside that dungeon."
anywhere = "Small keys can be in any shuffled chest, including the Well floor key. Its floor pickup gives its own key or 20 rupees and keeps a key-shaped model. Recovery and once-only leave/return/Continue passed in game. Shadow's floor key stays in its usual place until it has been tested in game. Needs Chest shuffle. Fortress jail keys have a separate switch. Messages name the key's dungeon; counters show only the dungeon you are in."
all_anywhere = "Experimental: small keys (including the Well floor key), boss keys (Ganon's Castle's too), maps and compasses can be in any shuffled chest. Map/compass display and the Well replacement's recovery and once-only pickup passed in game; not every combination has been played. Shadow's floor key stays in its usual place until it has been tested in game. Fortress jail keys have a separate switch. Pickup messages name the target dungeon. Needs Chest shuffle."
[songs.choice_help]
song = "Find songs only at the usual song rewards."
anywhere = "Songs can appear in the other places you shuffle, Gold Skulltulas and floor hearts included (not shops). Song of Storms and Minuet of the Forest have been played from chests. Prelude of Light and Zelda's Lullaby were played from Skulltulas. On floors, Prelude was played after a freestanding pickup; Lullaby was picked up, but use was not demonstrated. At Queen Gohma's heart, both songs were picked up and did not respawn, but using those song rewards was not demonstrated. The other ten songs are accepted by analogy, not individually played."
[forest.choice_help]
closed = "Mido needs your sword and shield, and the forest bridge opens after Gohma, like the usual route."
closed_deku = "Open the forest bridge immediately. Mido still needs your sword and shield before you enter the Deku Tree, including after an early Zelda visit. The passage and tree mouth stayed open after reload in the repaired check."
open = "Open the forest bridge immediately and let you past Mido without showing a sword and shield."
[door_of_time.choice_help]
closed = "Use the Spiritual Stones, Ocarina of Time and Song of Time after Impa's send-off. With dungeon reward shuffle, the three owned Stones replace the usual boss-completion requirement. Opening with three Stones and refusal with only Emerald and Ruby both passed; the saved state confirmed the closed Door."
song_only = "Meet Zelda and finish Impa's field send-off, then use the learned Song of Time and either ocarina, without stones. The escape and both moat rewards remain available after pulling early. That return/escape order was played in Open mode, not every Song-only combination."
open = "The Door stays shut until you meet Zelda as a child and finish Impa's field send-off, then opens without stones, an ocarina or songs. The send-off gate, early return and preserved escape/moat rewards passed on Longshot rc.7. This prevents new clock freezes, not repairs an old save."
[fast_start.choice_help]
intro = "Remove the opening movie entirely. New-game setup and Navi waking Link still run. Movie removal passed a new-game check."
saria = "Skip Saria's opening scene while keeping the forest visited so its pause map remains available. This does not give an item or change forest access."
deku_tree = "Skip the Deku Tree's opening talk. With Mido kept, you must still equip your sword and shield and talk to him to clear the path."
kaepora = "Experimental. Skip the selected Kaepora introductions without changing routes or item requirements. The castle owl kept a short fly-away without speech. On Longshot 3.0.0 stable, the Field owls near Kakariko and the Lake approach had no speech and a short look/fly-away; summit and Lake travel owls kept a short offer and working flights. Not every owl scene has been played."
[shop_prices.choice_help]
vanilla = "Keep the usual prices on the shop shelves you shuffle."
affordable = "Pay 10 rupees for each shelf you shuffle. Other shelves keep their usual prices."
[scrub_prices.choice_help]
vanilla = "Keep the usual 40- or 100-rupee fees for the one-time scrub sales."
fixed = "Pay your chosen fixed fee at the one-time scrub sales you shuffle. Repeat vendors do not change."
[hints.choice_help]
always = "Gossip Stones speak without the Mask of Truth."
mask = "Wear the Mask of Truth as a child to hear a Gossip Stone."
[hint_distribution.choice_help]
balanced = "A mix of clues about useful items, areas and routes."
strong = "More helpful clues about useful items."
very_strong = "More clues about required routes and useful areas, with fewer random clues."
useless = "Clues deliberately chosen not to help you find useful items."
