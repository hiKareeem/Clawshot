# Sources: plans/playtest/answers.md R7-BOSSHEART, R8-FREESTANDING, R8-FROGS;
# plans/03-game-data.md sections 19, 21, 23, 34, 36, 40.
# Check totals come from generation, not duplicated metadata that goes stale with new checks.
[shuffle.choice_help]
Chest = "Chests across the remake. Finding a different item in a chest, including a large reward in a small chest, has been tried in game. Trap chests and the Treasure Chest Game's ordinary boxes stay as usual."
Shop = "Shelves in ordinary shops, using items the shop can display properly. Kokiri purchases and affordable prices have been tried in game. Mask loans stay as usual."
Gift = "Gifts from characters and song rewards, including Great Fairies, frogs and minigames. Fairy rewards that can be collected only once and the supported frog rewards have been tried in game. Other gifts stay as usual."
Scrub = "One-time Deku Scrub purchases. Repeat vendors do not change. Buying a shuffled reward has not yet been checked in game."
BossHeart = "Heart containers after bosses can become hearts, heart pieces, shields or a red rupee. King Dodongo's replacement shield was collected without adding a heart and did not return in Kareem's test."
Freestanding = "Heart pieces lying around the world can become the same items as boss hearts. The ranch tower's replacement shield was collected and equipped without adding a heart piece in Kareem's test."
Token = "Gold Skulltulas still give their original tokens. A test with a different reward added a token instead, so these rewards cannot be shuffled yet."
[dungeon_items.choice_help]
own_dungeon = "Find a dungeon's keys, maps and compasses only inside that dungeon."
anywhere = "Small keys can be in any shuffled chest, including other dungeons and the overworld. The pickup message names the key's dungeon (in English in every language). The game's key counters only show the dungeon you are in."
[songs.choice_help]
song = "Find songs only at the usual song rewards."
anywhere = "Songs can appear in the other places you shuffle. Song of Storms and Minuet of the Forest have been played after finding them in chests."
[forest.choice_help]
closed = "Mido needs your sword and shield, and the forest bridge opens after Gohma, like the usual route."
closed_deku = "Open the forest bridge immediately. Mido still needs your sword and shield before you enter the Deku Tree. The bridge change has been tried in game."
open = "Open the forest bridge immediately and let you past Mido without showing a sword and shield."
[door_of_time.choice_help]
closed = "Open the door with the Spiritual Stones, Ocarina of Time and Song of Time, like the usual route. Its first in-game check passed."
song_only = "Open the door with the learned Song of Time and either ocarina, without the stones. Its first in-game check passed; returning to child after an early visit is untested."
open = "The door starts open without the stones or song. Its first in-game check passed; returning to child after an early visit is untested."
[fast_start.choice_help]
intro = "Remove the opening movie entirely. New-game setup and Navi waking Link still run. Movie removal is built, not yet tested in game."
saria = "Skip Saria's opening scene while keeping the forest visited so its pause map remains available. This does not give an item or change forest access."
deku_tree = "Skip the Deku Tree's opening talk. With Mido kept, you must still equip your sword and shield and talk to him to clear the path."
kaepora = "Skip the selected Kaepora introductions. Routes and item requirements stay the same."
[shop_prices.choice_help]
vanilla = "Keep the usual prices on the shop shelves you shuffle."
affordable = "Pay 10 rupees for each shelf you shuffle. Other shelves keep their usual prices."
[scrub_prices.choice_help]
vanilla = "Keep the usual 40- or 100-rupee fees for the one-time scrub sales."
fixed = "Pay your chosen fixed fee at the one-time scrub sales you shuffle. Repeat vendors do not change."
[hints.choice_help]
always = "Gossip Stones speak without the Mask of Truth."
mask = "Wear the Mask of Truth as a child to hear a Gossip Stone."
[hint_distribution.choice_help]
balanced = "A mix of clues about useful items, areas and routes."
strong = "More helpful clues about useful items."
useless = "Clues deliberately chosen not to help you find useful items."
