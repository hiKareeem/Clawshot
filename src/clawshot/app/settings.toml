# Presentation only. Defaults and validation remain in Settings/data settings.toml.
# A table with logic_override is a switch for one supported boolean logic override, not a Settings field.
[shuffle]
label = "What to shuffle"
kind = "multi"
display = "cards"
status_labels = { on = "Shuffled", off = "Vanilla" }
choices = ["Chest", "Shop", "Gift", "Scrub", "BossHeart", "Freestanding", "Token"]
group = "Items"
help = "Choose where you want to find shuffled rewards. Point at a card to see what it includes and what has been tried in game."
[dungeon_items]
label = "Dungeon items"
kind = "choice"
choices = ["own_dungeon", "anywhere", "all_anywhere"]
group = "Items"
help = "Small keys anywhere moves small keys into shuffled chests, including the Well floor key; boss keys, maps and compasses stay home. All dungeon items anywhere is experimental and moves those too. Well recovery and once-only collection, and map/compass display, passed in game. Shadow's floor key stays in its usual place until it has been tested in game. Fortress jail keys have a separate experimental switch."
[shuffle_hideout_keys]
label = "Fortress jail keys (experimental)"
kind = "boolean"
group = "Items"
# Played evidence: plans/rounds/r20-cows.md, four-rescue check (2026-11-21, Longshot 3.0.0 stable).
help = "Off by default; needs shuffled chests. Move the four guards' floor keys into chests, leaving red-rupee replacements with a key-shaped model. Answer Yes to the Valley carpenter boss before the jail encounters. One guard/rescue and its once-only 20-rupee drop passed, including return and Continue. On Longshot 3.0.0, four keys from four chests, all four rescues, the captain's card once and Training Ground entry with its 30-rupee fee also passed; this is not a full playthrough."
enabled_when = [{ key = "shuffle", contains = "Chest", reason = "Shuffle chests to move Fortress jail keys." }]
[shuffle_100_token_reward]
label = "100-token reward (experimental)"
kind = "boolean"
group = "Items"
# Played evidence: plans/rounds/r19-tokens.md (2026-11-20, Longshot 3.0.0 stable).
help = "Off by default: the first 100-token Skulltula House reward holds only junk. Needs shuffled gifts. On lets it hold progression, so a seed may require collecting all 100 Gold Skulltula tokens. Played on Longshot 3.0.0: Hammer at 100 tokens, then the repeating gold rupee."
enabled_when = [{ key = "shuffle", contains = "Gift", reason = "Shuffle gifts to let the 100-token reward hold progression." }]
[dungeon_rewards]
label = "Dungeon reward shuffle (experimental)"
kind = "boolean"
group = "Items"
help = "Off by default. Shuffle the three stones and six medallions among their nine usual rewards, including Rauru. First-pull reward delivery passed. With this on, the closed Door opened with three owned stones before Dodongo/Jabu completion. With only Emerald and Ruby owned, it stayed closed with no opening scene; the saved state confirmed the refusal. Ocarina of Time, Song of Time and Impa's send-off are still needed. Boss completion still controls blue warps, sage scenes, restoration, Prelude and the Light Arrow story."
[shuffle_master_sword]
label = "Master Sword shuffle (experimental)"
kind = "boolean"
group = "Items"
# Played evidence: plans/rounds/r19-sword.md, final v4 acceptance (2026-11-20, Longshot 3.0.0 stable).
help = "Off by default; needs shuffled chests and Free time travel on for now. The pedestal's first pull gives a shuffled item instead of the Master Sword, which can then be found only in a shuffled chest. The pedestal still moves Link between ages, and adult Link has no Master Sword until he finds it. Played on Longshot 3.0.0: pulls without the sword, finding and using it in a chest, and pulls with it."
enabled_when = [{ key = "shuffle", contains = "Chest", reason = "Shuffle chests to move the Master Sword." }]
[excluded_locations]
label = "Excluded locations"
kind = "multi"
display = "locations"
group = "Items"
help = "Empty by default. Excluded checks never hold progression, anything a seed may need to finish. Permanently held progression checks are not offered. A check whose kind you leave unshuffled keeps its usual item: excluding it changes nothing, and one that usually holds progression cannot be excluded, so shuffle its kind or remove it. Choices that leave too little room for progression and held items are refused before generation. Search by check name, world name or area."
[bridge]
label = "Ganon's Castle bridge (experimental)"
kind = "choice"
choices = ["vanilla", "stones", "medallions", "rewards", "tokens"]
group = "World"
# Played evidence: plans/rounds/r20-trials.md, 16-token bridge (2026-11-21, Longshot 3.0.0 stable).
help = "Vanilla follows the usual Light Arrow story. Count modes open only the bridge with owned rewards or native Gold Skulltula token stock. Medallion count passed below/at its threshold in game. Token mode passed on Longshot 3.0.0 with 16 tokens: closed at 15, opened at 16 with a chest token, and stayed open after Save/Continue. This does not skip the remaining trials."
[bridge.labels]
vanilla = "Vanilla story"
stones = "Stones"
medallions = "Medallions"
rewards = "Stones and medallions"
tokens = "Gold Skulltula tokens"
[bridge.choice_help]
vanilla = "Keep the native bridge scene after the Temple's Light Arrow story."
stones = "Require the selected count of unique owned Spiritual Stones, from zero to three."
medallions = "Require the selected count of unique owned medallions, including Light, from zero to six."
rewards = "Require the selected count of unique owned stones and medallions, from zero to nine."
tokens = "Require 0–100 Gold Skulltula tokens in the native counter, including tokens found in shuffled chests; spends no tokens. A 16-token bridge passed on Longshot 3.0.0: closed at 15, opened at 16 with a chest token, and stayed open after Save/Continue."
[bridge_count]
label = "Bridge count"
kind = "integer"
min = 0
max = 100
group = "World"
help = "Vanilla uses zero. Stones allows 0–3; Medallions 0–6; Stones and medallions 0–9; Gold Skulltula tokens 0–100. Token mode counts items, including chest tokens, not defeated Skulltulas. This does not skip trials."
[trials_count]
label = "Ganon's trials remaining (experimental)"
kind = "integer"
min = 0
max = 6
group = "World"
# Played evidence: plans/rounds/r20-trials.md (zero, 2026-11-21) and plans/rounds/r21-checks.md (one and two, 2026-11-23), Longshot 3.0.0 stable.
help = "Six keeps vanilla. Zero clears all trials; one to five selects that many remaining trials from a dedicated seeded stream. The spoiler, play note and first barrier-view text name them. New games only. Played on Longshot 3.0.0: zero (on an adjusted save, not a fresh game) has no barrier and a working tower lift after Save/Continue; one passed end to end (a new game's beam and text, then the last trial, barrier scene, pots and lift from a castle save adjusted to one remaining trial); two passed for its first trial keeping the tower shut. Three to five are not played yet."
[songs]
label = "Song placement"
kind = "choice"
choices = ["song", "anywhere"]
group = "Items"
help = "Find songs at the usual song rewards, or mix them into the other places you shuffle. Automatic lessons can still freeze without a usable ocarina. Logic requires one before the lesson, but cannot protect a player who walks into the scene without it."
[forest]
label = "Kokiri Forest"
kind = "choice"
choices = ["closed", "closed_deku", "open"]
group = "World"
help = "Leave Mido and the forest bridge closed, open just the bridge, or open both."
clears = { logic = ["open_forest", "skip_mido"] }
[door_of_time]
label = "Door of Time"
kind = "choice"
choices = ["closed", "song_only", "open"]
group = "World"
help = "Closed keeps the usual stones, Ocarina of Time and Song of Time route. Both early modes wait until you meet Zelda and finish Impa's field send-off: Song-only then needs the learned Song of Time and either ocarina; Open needs no songs or stones. The escape and both moat rewards remain available after pulling the sword early."
clears = { logic = ["door_of_time"] }
[free_time_travel]
label = "Free time travel (experimental)"
kind = "boolean"
group = "World"
logic_override = "free_time_travel"
clears = { logic = ["free_time_travel"] }
help = "Experimental, off by default. After Sheik's first adult scene, return to child before the Forest Temple and change age freely. Seeds may expect those early trips. Prelude still follows Forest completion. Early return, repeated age changes, first adult arrival, Prelude and the repaired child sword return have passed in game. This does not repair an old seed or save."
[bombs_without_bracelet]
label = "Bag bombs without the Bracelet (experimental)"
kind = "boolean"
group = "World"
logic_override = "bombs_without_bracelet"
clears = { logic = ["bombs_without_bracelet"] }
help = "Off by default. Use bombs from the Bomb Bag without strength upgrades; logic follows. The Bomb Bag is still required. Bomb Flowers still need strength, and Bombchus still need the Bomb Bag. Played on Longshot 3.2.0: with the Bomb Bag and no Bracelet, bag bombs worked, also after reloading, while Goron City's Bomb Flowers still could not be picked up. Not every route this opens has been played."
[starting_items]
label = "Starting items (experimental)"
kind = "multi"
group = "Starting inventory"
# Played evidence: plans/rounds/r20-start.md, broad start (2026-11-21, Longshot 3.0.0 stable).
help = "Empty by default. Choose owned items for New Game only. Choose the highest upgrade tier you want; earlier tiers and weapon containers are included. Selected pool copies become junk. Songs do not complete their lessons or story quests. Unsupported trade items, bottles, masks, Lens, keys, tokens and rewards are refused. Played on Longshot 3.0.0 with one broad start (sword, shield, Slingshot, Boomerang, bombs, Bracelet, Hookshot, Ocarina of Time, two songs, wallet, Deku Tree map and compass): the items worked, song lessons still played, and the pause maps worked. Other choices are not each played."
[starting_hearts]
label = "Extra starting hearts"
kind = "integer"
min = 0
max = 17
group = "Starting inventory"
help = "Zero by default: three hearts. Add up to 17 full hearts on New Game only. Matching pooled Heart Containers become junk when present; native unshuffled sources stay."
[starting_full_wallet]
label = "Start with a full wallet"
kind = "boolean"
group = "Starting inventory"
help = "Off by default. New Game starts at the chosen wallet's capacity: 200, 500 or 1000 rupees. It never refills an existing save or pretends a wallet upgrade was acquired."
[fast_start]
label = "Fast start"
kind = "multi"
choices = ["intro", "saria", "deku_tree", "kaepora"]
display = "cards"
status_labels = { on = "Skipped", off = "Plays" }
group = "World"
help = "Choose which opening scenes to skip. Skipped shortens the opening; Plays leaves the usual scene. Forest access has its own setting."
[skippable_story]
label = "Skippable story dialogue"
kind = "boolean"
group = "World"
hidden = true
help = "Skippable story dialogue isn't available yet."
[skip_saria_farewell]
label = "Skip Saria's bridge farewell (experimental)"
kind = "boolean"
group = "World"
# Played evidence: plans/rounds/r19-scenes.md, morning candidates (2026-11-20, Longshot 3.0.0 stable).
help = "Off by default. Skip the bridge farewell movie and gift animation, giving that location's actual item through the normal item-get window. Source completion and story flags remain. Separate from Saria's opening scene. Played on Longshot 3.0.0: correct item text, then straight to Hyrule Field without the farewell movie."
[event_item_models]
label = "Show shuffled items in events"
kind = "boolean"
group = "World"
# Played evidence: plans/event-items.md, pilot and task 14 runs (2026-11-25/26, Longshot 3.2.0, BBender).
help = "On by default. Gift and reward scenes show the item the seed gives there instead of the vanilla one: Saria presents it at the forest bridge, Zelda throws it into the moat and Link holds it, and with dungeon reward shuffle the boss and sage scenes and Ruto's stone in Jabu-Jabu's Belly show the reward placed there. A song shows its ocarina with the song's effect. The item keeps the scene's native pose, so a big item can clip or look odd; in the moat scene Link's own ocarina still shows beside it. Off keeps every scene's native model; the item texts name the given item either way. Played on Longshot 3.2.0: Saria's farewell, the Deku Tree's farewell, the Lost Woods target, Ruto's stone, Barinade's, Bongo Bongo's and Twinrova's rewards, Rauru, the Light Arrows scene and the moat; Biggoron, the Eyedrops trade and Volvagia's and Morpha's rewards are checked against the written files only."
[shop_prices]
label = "Shop prices"
kind = "choice"
choices = ["vanilla", "affordable"]
group = "Prices"
help = "Make the shop shelves you shuffle cost 10 rupees each."
enabled_when = [{ key = "shuffle", contains = "Shop", reason = "Shuffle shop shelves to change their prices." }, { key = "shop_slots", greater_than = 0, reason = "Select at least one shuffled shelf per shop to change its price." }]
[shop_slots]
label = "Shuffled shelves per shop"
kind = "integer"
min = 0
max = 8
group = "Prices"
help = "Choose how many shelves in each ordinary shop can hold shuffled items. Other wares stay as usual."
enabled_when = [{ key = "shuffle", contains = "Shop", reason = "Shuffle shop shelves to choose how many shelves change." }]
[scrub_prices]
label = "Scrub prices"
kind = "choice"
choices = ["vanilla", "fixed"]
group = "Prices"
help = "Keep the usual fees or set one price for the one-time scrub sales you shuffle. Repeat vendors do not change."
enabled_when = [{ key = "shuffle", contains = "Scrub", reason = "Shuffle one-time scrub sales to change their prices." }]
[scrub_price]
label = "Fixed scrub fee"
kind = "integer"
min = 0
max = 1000
group = "Prices"
help = "The price for the one-time scrub sales you shuffle when Fixed fee is selected."
enabled_when = [{ key = "shuffle", contains = "Scrub", reason = "Shuffle one-time scrub sales to set a fee." }, { key = "scrub_prices", equals = "fixed", reason = "Choose Fixed fee for scrub prices to use this amount." }]
[cheap_deku_shield]
label = "Affordable Deku Shield"
kind = "boolean"
group = "Prices"
help = "Buy the Deku Shield at Kokiri Shop for 10 rupees, even if you leave shop items unchanged."
[hints]
label = "Gossip Stones"
kind = "choice"
choices = ["always", "mask"]
group = "Hints"
help = "Let Gossip Stones speak without the Mask of Truth, or require you to wear it."
[hint_distribution]
label = "Hint distribution"
kind = "choice"
choices = ["balanced", "strong", "very_strong", "useless"]
group = "Hints"
help = "Choose how helpful the Gossip Stone clues are."
[logic]
label = "Logic overrides (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced: change which routes the generator assumes you can use. Leave this alone for normal play. Free time travel has its own switch under World; untested tricks are not allowed."
[areas]
label = "Playtest areas (JSON array)"
kind = "json"
group = "Advanced"
help = "Advanced: list game-file area codes for a short playtest and set a goal too. Leave empty to include the whole game."
[goal]
label = "Playtest goal"
kind = "nullable-text"
group = "Advanced"
help = "Set the finish condition for a short playtest. Leave blank for a normal whole-game seed."
[item_location_types]
label = "Item destination restrictions (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced: limit where particular items can appear. Usually filled in automatically; leave these values alone for normal play."
[exclusive_location_types]
label = "Exclusive check types (JSON array)"
kind = "json"
group = "Advanced"
help = "Advanced: reserve the listed kinds of reward spots for specially assigned items. Leave automatic values alone for normal play."
[location_type_items]
label = "Pickup replacements (JSON object)"
kind = "json"
group = "Advanced"
help = "Advanced: choose which items floor drops, boss hearts and Gold Skulltulas can become. The game can handle only certain replacements."

