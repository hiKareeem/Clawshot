[game]
label = "Your game"
help = "Only your game files are required. Choose an extracted romfs folder or a full .nup. Hookshot is optional and is used only by Play."
note = "Checking game files never starts the game. Emulator players can skip Hookshot."
[settings]
label = "Settings"
help = "Choose where rewards can move and which world options to use. Recommended gives you the standard test setup; Defaults restores the original generator options."
note = "Options that are not ready stay visible and explain why you cannot use them."
[generate]
label = "Generate a seed"
help = "Make a new seed while the menu stays usable. Cancel stops this seed without changing any earlier seed or your game files."
note = "Keep the number, settings and Clawshot version if you want to make the same seed again."
[hookshot]
label = "Hookshot folder (optional)"
help = "Only needed for the Play button. Emulator players can skip it."
note = "Choose the folder containing bin/hookshot.exe. Play keeps saves inside this seed's folder and never touches your normal saves."
[dump]
label = "Game dump"
help = "Choose the extracted romfs folder or full .nup for your copy of the game. Clawshot checks that it is the supported game version."
note = "Your game files are only read. Clawshot does not include or download a game."
[update]
label = "Update"
help = "Tick this when your update is kept apart from the game: its own romfs folder or .nup. Clawshot lays it over the game dump. Leave it off for a romfs with the update applied, a dump folder with base and updates inside, or a .nup that includes the update."
note = "Clawshot needs Version 1.1.1: the Version 1.0.0 cart files plus the update. The update is only read."
[seed]
label = "Seed number"
help = "Choose a whole number or press Random. The same number and settings make the same seed."
note = "Sharing the number alone is not enough: keep the settings and Clawshot version too."
[output]
label = "Output folder"
help = "Choose a new folder for this seed. Browse chooses a parent and adds seed-<number>. The suggested folder is under Documents and is created when you generate."
note = "Older seeds are never replaced. Choose a new name outside your game folders."
[settings-string]
label = "Settings string"
help = "Copy these settings to share them. Paste settings and press Apply to update the menu. Changing an option updates the string for you."
note = "Use the same seed number, Clawshot version and game version to make the same seed."
[stage-validate]
label = "Check game and settings"
help = "Check that these are the right game files and that your chosen options work together."
[stage-source]
label = "Read your game files"
help = "Read your game folder, or make a temporary working copy of the needed files from your .nup. Your original files stay unchanged."
[stage-prepare]
label = "Prepare supported checks"
help = "Work out which rewards can be changed without breaking how you collect them."
[stage-generate]
label = "Place items and check you can finish"
help = "Shuffle the rewards and check that the resulting game can be finished before writing anything."
[stage-write]
label = "Write and verify the mod"
help = "Write the changed game files, play note and spoiler into a temporary folder, then check them."
[stage-publish]
label = "Finish the new seed folder"
help = "Move the finished seed into your new output folder. If another seed is already there, stop instead of replacing it."
[play]
label = "Play in Hookshot"
help = "Start this seed in Hookshot with a save folder of its own inside the output. Your normal saves are never touched."
note = "Quit a running Hookshot game before starting another seed. Play needs Windows and a Hookshot build that can load mods."
[seeds]
label = "My seeds"
help = "Open a folder containing seeds you made earlier. Clawshot checks their files before allowing Play; your original game dump is not needed to play them."
note = "A seed with missing information or changed files is shown with a reason instead of being played."
[emulator]
label = "Copy to my emulator"
help = "Choose your emulator's mod folder for this game once. Copy this seed there as real folders; an existing copy is never replaced."
note = "Back up your emulator saves first: an emulator uses your normal saves. Enable only this seed in the emulator."
