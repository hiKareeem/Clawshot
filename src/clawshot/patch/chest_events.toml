# Chest open-event overrides: a chest's Dynamic.GetEventName, a row of RSDB/EventSetting that replaces the chest's
# default open event (Dm_SY_Treasurebox for big chests, Dm_SY_TreasureboxSmall for small ones). Loaded by
# clawshot.patch.events. plans/03-game-data.md section 3 describes them.
#
# `patch` says what the writer does to a chest whose item changes:
#   remove  the override plays something tied to the vanilla item (its cutscene, a Navi line about it, a story
#           step): the writer deletes GetEventName, so the chest plays its default event, which grants whatever
#           the chest holds (round 2, in game: the Kokiri Sword chest without its override gave its Red Rupee
#           through the default event, no sword, no cutscene).
#   keep    the override is the default event plus state that does not depend on the item.
# A chest whose item does not change keeps its override. A chest with an override not listed here stops the
# writer.
#
# `flow` is the row's FlowchartFileName and EntryPointName; `does` is read from the decoded flows (zeldamods evfl,
# outside the repository, plans/03-game-data.md). Navi balloon lines are named by index only: which item a line
# names is inferred from the event's name, the text was not read. `story_state` (remove only) is the state the
# override leaves that the default event does not, and how a seed gets it back.

[event.Get_StoneOfForest_GetSword]
flow = "Get_StoneOfForest:GetSword"
patch = "remove"
does = "the big-chest event, then the Kokiri Sword cutscene Dm_Kokiri_0063 (creates and equips Weapon_Sword_Kokiri), then a Navi line chosen by Mido's talk flags and IsGet.Weapon_Shield_Deku"
story_state = "nothing to restore [inference]: neither flow sets a game-data flag; HavePlayedEvent.Get_StoneOfForest_GetSword and HavePlayedEvent.Dm_Kokiri_0063 are read by no event flow or Logic/Sequence AINB (byte search); Mido reads owning the sword, which the Kokiri Sword item gives wherever it is found (plans/rounds/r2-census.md)"

