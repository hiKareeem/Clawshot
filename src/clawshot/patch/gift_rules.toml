# How each gift check (census kinds npc_gift, event_gift, song, linked to an OoT Randomizer name) is changed when it
# gives another item: plans/03-game-data.md section 19 has the evidence. Read by clawshot.patch.gifts.
#
#   class   "swap"     set the item parameter of every step of the check (the census steps)
#           "rewrite"  the same, plus the edits below
#           "more"     not changeable yet; `reason` says what it needs
#   given   reads ("<flow>/<event>", EventQueryIsGameDataBool on IsGet.<vanilla item>) that mean "this check was
#           given"; they are made to read the check's flag instead
#   flag    an existing saved flag the game sets once the check is given and on no other path; without it, the patch
#           adds a saved Bool `Clawshot.Gift.<flow>.<event of the first step>` to GameDataList and sets it right
#           after each step (last resort: it changes the save layout)
#   skip    events ("<flow>/<event>") whose predecessors are pointed at their `next`
#   gate    what stops the check giving twice in the game (evidence; not used by the patch)
#   once    equipped-Deku-Shield queries replaced with the check's saved Bool; set after every grant branch

[check."KF Shopkeeper Gift"]
class = "rewrite"
gate = "Section 28 / r6-play: first-talk flag is saved but vanilla repeats; use it to gate both grant branches"
flag = "HaveTalked_Npc_Kokiri_001_Shop_Child_PresentDekuShield"
once = ["Npc_Kokiri_001_Shop_Child/Event45"]

[check."Barinade"]
class = "more"
gate = "the cutscene plays once"
reason = "no flow reads the reward; the game's story gates read the dungeon's quest step instead (DoorOfTime asks Get_StoneOfFire_IsCompleted_Exp, ...), so a moved reward breaks them both ways"

