# --- hand binds (binds an event lacks) ----------------------------------------------------------------------------
#
#   template   a flowchart actor whose bind and offstage actions, and the parameters of its first such events, are copied
#   target     the actor whose bone takes the container; bone the bone
#   start/end  the cuts (entry points) before which the container is bound and sent offstage

# Link's look in the moat scene (cuts C01-C04: he takes the item from the water and looks at it): his animation shows
# his own equipped ocarina and the flow binds no item, so the given item's container is bound to his left hand as in
# Saria's farewell (Dm_Kokiri_0155 Event93). Played run E10 and pilot arm A, BBender 2026-11-26: the Piece of Heart sits
# sensibly in his hand; his own ocarina still shows beside it (known issue: pilot arm B, the scene's HoldOcarina key
# renamed, did not hide it; plans/event-items.md).
[[hand]]
check = "HF Ocarina of Time Item"
item = "Item_Ocarina_Time"
event = "Dm_MelodyGet_Time"
template = "Dm_Item_Ocarina_Time"  # Zelda's ocarina entry (played, excluded): its bind and offstage only
target = "Player_Event"
bone = "Weapon_L"
start = "C01"
end = "C05"

# --- exclusions (spec 2.8) ----------------------------------------------------------------------------------------

[exclude.played]
reason = "an instrument someone plays in the event, not the item given; it keeps its look (D3)"
actors = [
  # Zelda's ocarina in the Song of Time lesson (Event35 binds it to her Weapon_L): a memory of her playing it. Listed
  # before as Link's look (D5) until the played run E10 showed it in Zelda's hands (BBender, 2026-11-26).
  "Dm_MelodyGet_Time/flowchart/Dm_Item_Ocarina_Time",
  "Dm_Kokiri_0150/timeline/Dm_Item_Ocarina_Fairy_Saria@0",
  "Dm_Kokiri_0155/flowchart/Dm_Item_Ocarina_Fairy_Saria@saria",
