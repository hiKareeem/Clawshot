# Event props: the actors an event shows as the item its check gives (spec event-items 2.1; inventory in
# plans/event-items.md). Identifiers only (AGENTS.md rule 1). Read by clawshot.patch.event_props.
#
# Every item actor (Dm_Item_*, Item_*, Weapon_Sword_*) that an event flowchart or timeline binds, animates or brings on
# stage (clawshot.census.event_items.scan_prop_actors) is either a [[prop]] here or covered by an [exclude.*] list;
# tests/test_event_props_dump.py fails on a new, missing or stale entry.
#
#   check      the gift check (gift_rules.toml) or dungeon reward slot (data/dungeon_rewards.toml)
#   item       the vanilla item actor the prop stands for (the check's grant; for a branch, that branch's grant)
#   event      the flow file; part "flowchart", "timeline" or "placement"; actor and secondary name identify the actor
#   grant      for a branch pair: the "<flow>/<event>" grant the branch belongs to (D13)
#   banc, hash for a placed object: the placement file and the actor's Hash
#   scene_as   for a flowchart prop the flow plays a scene animation on (EventPlayAS): the animation set its EventSetting
#              row loads for it (ExtraResources.EventAS, Work/AS/Root/Event/<scene_as>.root.as), the one whose ASB
#              holds the played nodes. A song container's event user gets a trigger on each "<scene_as>/<node>"
#              (decision D20). Source: Claude, dump 1.1.1, 2026-11-27 (EventSetting rows, AS/<scene_as>.root.asb);
#              played for the target and Darunia (pilot A, BBender, runs S12, S13).
#
# Source: Claude, dump 1.1.1, 2026-11-25 (scan_prop_actors, census gift steps).

