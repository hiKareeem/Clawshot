[project]
name = "clawshot"
version = "0.1.2"
description = "Item randomizer for The Legend of Zelda: Ocarina of Time on Nintendo Switch 2"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "zstandard>=0.23",
]

[project.optional-dependencies]
ui = ["pywebview>=6.1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clawshot"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dump: needs the player's romfs in OOT_ROMFS; skipped when it is unset",
]
